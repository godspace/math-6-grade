    <style>
        :root {
            --bg-base: #0b0f19;
            --bg-panel: rgba(17, 24, 39, 0.8);
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.6);
            --error: #ef4444;
            --error-glow: rgba(239, 68, 68, 0.6);
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.1), transparent 25%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* HUD (Верхняя панель) */
        .hud {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--bg-panel);
            padding: 15px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .mission-info {
            display: flex;
            flex-direction: column;
        }

        .mission-name {
            font-size: 0.9rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .level-dots {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }

        .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
        }

        .dot.active {
            background: var(--primary);
            box-shadow: 0 0 8px var(--primary-glow);
        }

        .streak-container {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .streak-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .streak-value {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--warning);
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
            transition: transform 0.2s;
        }

        .streak-value.pop {
            transform: scale(1.3);
        }

        /* Игровое поле */
        .target-display {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeIn 0.5s ease;
        }

        .target-title {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .target-number {
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(to right, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.3));
        }

        /* Сетка карточек */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 500px;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .card:active {
            transform: scale(0.95);
        }

        /* Эффекты при тапе */
        .card.correct {
            background: rgba(16, 185, 129, 0.2);
            border-color: var(--success);
            color: var(--success);
            box-shadow: 0 0 20px var(--success-glow), inset 0 0 20px var(--success-glow);
            animation: correctPop 0.4s forwards;
            pointer-events: none;
        }

        .card.incorrect {
            background: rgba(239, 68, 68, 0.2);
            border-color: var(--error);
            color: var(--error);
            box-shadow: 0 0 20px var(--error-glow);
            animation: shake 0.4s forwards;
        }

        /* Анимации */
        @keyframes correctPop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); filter: brightness(1.5); }
            100% { transform: scale(0.8); opacity: 0; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px) rotate(-2deg); }
            40%, 80% { transform: translateX(10px) rotate(2deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Подсказка */
        .hint-btn {
            margin-top: 30px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-muted);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .hint-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: white;
        }

        .rule-display {
            margin-top: 15px;
            padding: 15px;
            background: rgba(59, 130, 246, 0.1);
            border-left: 3px solid var(--primary);
            border-radius: 0 10px 10px 0;
            font-size: 0.95rem;
            line-height: 1.4;
            display: none;
            max-width: 500px;
            text-align: center;
            animation: fadeIn 0.3s;
        }

        /* Экран завершения */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .overlay h2 {
            font-size: 3rem;
            color: var(--success);
            margin-bottom: 10px;
            text-shadow: 0 0 20px var(--success-glow);
        }

        .overlay p {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .btn-next {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            transition: transform 0.2s;
        }

        .btn-next:hover { transform: scale(1.05); }

        @media (min-width: 600px) {
            .grid { grid-template-columns: repeat(3, 1fr); max-width: 700px; }
            .card { height: 120px; font-size: 3rem; }
        }
    </style>
</head>
<body>

    <div class="hud">
        <div class="mission-info">
            <div class="mission-name" id="mission-name">Миссия 1: Окончания</div>
            <div class="level-dots" id="level-dots">
                <!-- Точки прогресса -->
            </div>
        </div>
        <div class="streak-container">
            <div class="streak-label">Комбо</div>
            <div class="streak-value" id="streak-val">x1</div>
        </div>
    </div>

    <div class="target-display">
        <div class="target-title">Уничтожь числа, делящиеся на</div>
        <div class="target-number" id="target-divisor">2</div>
    </div>

    <div class="grid" id="grid">
        <!-- Карточки генерируются здесь -->
    </div>

    <button class="hint-btn" id="hint-btn">Напомнить правило</button>
    <div class="rule-display" id="rule-display"></div>

    <div class="overlay" id="victory-overlay">
        <h2>Система взломана!</h2>
        <p>Ты прошел все миссии кибер-сканера.</p>
        <button class="btn-next" onclick="resetGame()">Играть снова</button>
    </div>

    <script>
        // Методическая база
        const rules = {
            2: "Смотри на последнюю цифру. Она должна быть чётной (0, 2, 4, 6, 8).",
            3: "Сложи все цифры числа. Если сумма делится на 3, то и число делится.",
            4: "Смотри только на две последние цифры. Если они делятся на 4 — всё число делится.",
            5: "Самое простое! Число должно заканчиваться на 0 или 5.",
            6: "Проверь два условия: число должно быть чётным И сумма его цифр должна делиться на 3.",
            9: "Сложи все цифры. Сумма должна делиться на 9.",
            10: "На конце должен быть только 0."
        };

        const checkers = {
            2: (n) => n % 2 === 0,
            3: (n) => String(n).split('').reduce((a, b) => a + parseInt(b), 0) % 3 === 0,
            4: (n) => (n % 100) % 4 === 0,
            5: (n) => n % 5 === 0,
            6: (n) => checkers[2](n) && checkers[3](n),
            9: (n) => String(n).split('').reduce((a, b) => a + parseInt(b), 0) % 9 === 0,
            10: (n) => n % 10 === 0
        };

        // Структура миссий
        const missions = [
            { id: 1, name: "Миссия 1: Окончания", divisors: [2, 5, 10], rounds: 3 },
            { id: 2, name: "Миссия 2: Сумма цифр", divisors: [3, 9], rounds: 3 },
            { id: 3, name: "Миссия 3: Хвосты", divisors: [4], rounds: 2 },
            { id: 4, name: "Миссия 4: Босс", divisors: [6], rounds: 3 }
        ];

        let currentMissionIdx = 0;
        let currentRound = 0;
        let streak = 1;
        
        let currentDivisor = 2;
        let correctCardsRemaining = 0;
        let isTransitioning = false;

        // DOM элементы
        const missionNameEl = document.getElementById('mission-name');
        const dotsContainer = document.getElementById('level-dots');
        const streakEl = document.getElementById('streak-val');
        const divisorEl = document.getElementById('target-divisor');
        const grid = document.getElementById('grid');
        const hintBtn = document.getElementById('hint-btn');
        const ruleDisplay = document.getElementById('rule-display');
        const victoryOverlay = document.getElementById('victory-overlay');

        function initGame() {
            if (window.RewardSystem) window.RewardSystem.resetErrors();
            currentMissionIdx = 0;
            currentRound = 0;
            streak = 1;
            updateStreakUI();
            startRound();
        }

        function resetGame() {
            victoryOverlay.classList.remove('active');
            initGame();
        }

        function startRound() {
            isTransitioning = false;
            const mission = missions[currentMissionIdx];
            
            // Обновляем HUD
            missionNameEl.textContent = mission.name;
            renderDots(mission.rounds, currentRound);
            
            // Прячем подсказку
            ruleDisplay.style.display = 'none';
            
            // Выбираем делитель
            currentDivisor = mission.divisors[Math.floor(Math.random() * mission.divisors.length)];
            
            // Анимация смены делителя
            divisorEl.style.opacity = 0;
            setTimeout(() => {
                divisorEl.textContent = currentDivisor;
                divisorEl.style.opacity = 1;
            }, 200);

            generateGrid(currentDivisor);
        }

        function renderDots(total, current) {
            dotsContainer.innerHTML = '';
            for(let i=0; i<total; i++) {
                const dot = document.createElement('div');
                dot.className = `dot ${i < current ? 'active' : ''}`;
                dotsContainer.appendChild(dot);
            }
        }

        function updateStreakUI() {
            streakEl.textContent = `x${streak}`;
            streakEl.classList.remove('pop');
            void streakEl.offsetWidth; // trigger reflow
            streakEl.classList.add('pop');
            
            if (streak > 5) streakEl.style.color = '#ec4899'; // Розовый неон
            else if (streak > 2) streakEl.style.color = '#f59e0b'; // Желтый
            else streakEl.style.color = '#94a3b8'; // Серый
        }

        function generateNumber(divisor, wantCorrect, usedNumbers) {
            let num;
            let attempts = 0;
            do {
                let base = Math.floor(Math.random() * 900) + 10; 
                if (wantCorrect) {
                    num = base * divisor;
                    if (num > 999) num = num % 1000; 
                    if (num % divisor !== 0) num += (divisor - (num % divisor));
                } else {
                    num = base;
                    if (checkers[divisor](num)) num += 1; 
                }
                attempts++;
            } while (usedNumbers.has(num) && attempts < 50);
            
            return num;
        }

        function generateGrid(divisor) {
            grid.innerHTML = '';
            const usedNumbers = new Set();
            let numbers = [];
            
            correctCardsRemaining = Math.floor(Math.random() * 2) + 2;
            const totalCards = 6;
            const incorrectCount = totalCards - correctCardsRemaining;

            for(let i=0; i<correctCardsRemaining; i++) {
                const num = generateNumber(divisor, true, usedNumbers);
                usedNumbers.add(num);
                numbers.push({ val: num, isCorrect: true });
            }

            for(let i=0; i<incorrectCount; i++) {
                const num = generateNumber(divisor, false, usedNumbers);
                usedNumbers.add(num);
                numbers.push({ val: num, isCorrect: false });
            }

            numbers.sort(() => Math.random() - 0.5);

            numbers.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.textContent = item.val;
                card.style.animation = `fadeIn 0.3s ease ${index * 0.05}s both`;
                card.addEventListener('pointerdown', (e) => handleTap(e, card, item));
                grid.appendChild(card);
            });
        }

        function handleTap(e, card, item) {
            if (isTransitioning || card.classList.contains('correct') || card.classList.contains('incorrect')) return;
            
            if (item.isCorrect) {
                // Успех!
                card.classList.add('correct');
                if (navigator.vibrate) navigator.vibrate(50);
                
                streak++;
                updateStreakUI();
                
                // Интеграция: сброс ошибок при правильном ответе
                if (window.RewardSystem) window.RewardSystem.resetErrors();
                
                // Интеграция: Награда за большое комбо (10 или 20 правильных подряд)
                if (streak === 10 || streak === 20) {
                    if (window.RewardSystem) {
                        setTimeout(() => {
                            window.RewardSystem.showWin(`Мега-комбо: x${streak}! Кибер-сканер`, "divisibility_signs");
                        }, 1000);
                    }
                }
                
                correctCardsRemaining--;
                if (correctCardsRemaining === 0) {
                    completeRound();
                }
            } else {
                // Ошибка!
                card.classList.add('incorrect');
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                
                streak = 1; // Сброс комбо
                updateStreakUI();
                
                // Интеграция: Регистрация ошибки
                if (window.RewardSystem) window.RewardSystem.registerError("divisibility_signs");
            }
        }

        function completeRound() {
            isTransitioning = true;
            currentRound++;
            
            const mission = missions[currentMissionIdx];
            renderDots(mission.rounds, currentRound); // Закрашиваем текущую точку

            setTimeout(() => {
                if (currentRound >= mission.rounds) {
                    // Переход на следующую миссию
                    currentMissionIdx++;
                    currentRound = 0;
                    
                    if (currentMissionIdx >= missions.length) {
                        // Победа в игре!
                        victoryOverlay.classList.add('active');
                        
                        // Интеграция: Награда за полное прохождение
                        if (window.RewardSystem) {
                            setTimeout(() => {
                                window.RewardSystem.showWin("Система взломана! Признаки делимости", "divisibility_signs");
                            }, 1500);
                        }
                        return;
                    }
                }
                startRound();
            }, 600); 
        }

        // Подсказка
        hintBtn.addEventListener('click', () => {
            ruleDisplay.textContent = rules[currentDivisor];
            ruleDisplay.style.display = 'block';
            streak = 1; // Использование подсказки сбрасывает комбо
            updateStreakUI();
        });

        // Запуск
        document.addEventListener('DOMContentLoaded', initGame);

    </script>
</body>
