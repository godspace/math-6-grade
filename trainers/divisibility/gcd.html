<style>
  :root {

  /* Мнемонический заголовок НОД */

  .mnem-word {

  .mnem-main {

  .mnem-word:nth-child(2) .mnem-letter { color: var(--warning); }

  /* Улучшенные инструкции с фокусом внимания */

  .pop-anim {

  .factor.clickable {
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05), inset 0 -2px 0 rgba(0,0,0,0.1);
  }

  .factor.clickable:hover:not(.matched):not(.selected) {
    background: #B2BEC3;
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 6px 12px rgba(0,0,0,0.1), inset 0 -2px 0 rgba(0,0,0,0.1);
  }

  @keyframes pulse-glow {
    0% { box-shadow: 0 0 0 0 rgba(253, 203, 110, 0.7); transform: scale(1.1); }
    70% { box-shadow: 0 0 0 10px rgba(253, 203, 110, 0); transform: scale(1.15); }
    100% { box-shadow: 0 0 0 0 rgba(253, 203, 110, 0); transform: scale(1.1); }

  .factor.selected {
    background: var(--warning);
    color: #2D3436;
    animation: pulse-glow 1.5s infinite;
    z-index: 2;
    position: relative;
  }

  .factor.matched {

  .sign { color: var(--text-muted); font-size: 20px; font-weight: 800; }

    border-style: solid;
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.15);
    background: #fff;
    transform: scale(1.1);

  input[type="number"].slot-input.wrong {
    border-style: solid;
    border-color: var(--danger);
    background-color: #ffeaa7;
    color: var(--danger);
    animation: shake 0.4s;

  input[type=number]::-webkit-inner-spin-button, 
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }

  .check-icon {
    color: var(--success);
    font-weight: 900;
    margin-left: 10px;
    font-size: 18px;
    background: rgba(0, 184, 148, 0.1);
    padding: 6px 12px;
    border-radius: 20px;
  }

  .common-area {
    margin-top: 30px;
    padding: 25px;
    border: 3px dashed rgba(108, 92, 231, 0.4);
    border-radius: 20px;
    background: rgba(108, 92, 231, 0.05);
    min-height: 80px;
    transition: all 0.3s;
  }

  .common-title { font-size: 18px; color: var(--primary); margin-bottom: 15px; font-weight: 800; }

  #common-factors { font-size: 32px; font-weight: 800; color: var(--primary); }
  #common-factors .factor { background: var(--success); color: white; box-shadow: 0 4px 10px rgba(0, 184, 148, 0.3); }

  .btn {
    padding: 14px 28px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    font-size: 18px;
    font-weight: 800;
    font-family: 'Nunito', sans-serif;
    margin-top: 20px;
    transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 6px 15px rgba(108, 92, 231, 0.3);
  }
  
  .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(108, 92, 231, 0.4); }
  .btn:active { transform: translateY(1px); }

  .hidden { display: none !important; opacity: 0; }
  
  #message {
    font-size: 18px;
    font-weight: 800;
    margin-top: 15px;
    min-height: 48px;
    border-radius: 12px;
    padding: 10px;
    transition: all 0.3s;
  }
  
  @keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-6px) rotate(-3deg); }
    50% { transform: translateX(6px) rotate(3deg); }
    75% { transform: translateX(-6px) rotate(-3deg); }
    100% { transform: translateX(0); }
  }

  #confetti-canvas {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 100;
  }
</style>

  <div id="game-board"></div>
  
  <div id="common-area" class="common-area hidden">
    <div class="common-title">Общие множители (Собери по одному из каждого ряда):</div>
    <div id="common-factors"></div>
    
    <div id="final-answer-area" class="hidden" style="margin-top: 20px; display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 10px;">
      <span style="font-size: 22px; font-weight: 800; color: var(--text-main);">НОД = </span>
      <span id="equation-display" style="font-size: 24px; font-weight: 900; color: var(--primary);"></span>
      <input type="number" id="gcd-input" class="slot-input" style="border-style: solid; border-color: var(--text-muted); color: var(--text-main);" placeholder="?">
      <button class="btn" style="margin-top: 0;" id="gcd-submit-btn" onclick="checkGCD()">Ответить ✨</button>
    </div>
  </div>

  <!-- Блок проверки -->
  <div id="verification-area" class="common-area hidden" style="border-color: var(--warning); background: rgba(253, 203, 110, 0.1);">
    <div class="common-title" style="color: #d35400;">Проверка (Раздели каждое число на НОД):</div>
    <div id="verification-board"></div>
  </div>
  
  <p id="message"></p>
  <button id="restart-btn" class="btn hidden" onclick="initGame()" style="background: var(--text-main); box-shadow: 0 6px 15px rgba(45, 52, 54, 0.3);">Новое задание 🎲</button>
</div>

<script>
  const sets = [
    [36, 54, 72], [24, 36, 48], [18, 27, 45], [30, 45, 60],
    [12, 18, 30], [40, 60, 80], [28, 42, 70], [48, 72, 96]
  ];
  
  let currentSet = [];
  let targetFactors = []; 
  let factorsArr = [];    
  let matchedFactors = [];
  let expectedGCD = 1;
  let currentStage = 1; 
  let currentSelection = { value: null, items: [] }; 

  function vibrate(ms) { if ('vibrate' in navigator) navigator.vibrate(ms); }

  function isPrime(num) {
    if (num < 2) return false;
    for (let i = 2; i <= Math.sqrt(num); i++) {
      if (num % i === 0) return false;
    }
    return true;
  }

  function getPrimeFactors(num) {
    let factors = [];
    let d = 2;
    while (num >= 2) {
      if (num % d === 0) { factors.push(d); num /= d; } else { d++; }
    }
    return factors; 
  }

  function setInstruction(htmlText, stage) {
    const instr = document.getElementById('instructions');
    instr.innerHTML = htmlText;
    
    instr.classList.remove('pop-anim');
    void instr.offsetWidth; 
    instr.classList.add('pop-anim');

    if (stage === 2 || stage === 4) {
      instr.style.background = 'rgba(0, 184, 148, 0.1)';
      instr.style.color = 'var(--success)';
      instr.style.borderColor = 'rgba(0, 184, 148, 0.4)';
    } else if (stage === 3) {
      instr.style.background = 'rgba(253, 203, 110, 0.15)';
      instr.style.color = '#d35400';
      instr.style.borderColor = 'rgba(253, 203, 110, 0.6)';
    } else {
      instr.style.background = 'rgba(108, 92, 231, 0.1)';
      instr.style.color = 'var(--primary)';
      instr.style.borderColor = 'rgba(108, 92, 231, 0.4)';
    }
  }

  function initGame() {
    if (window.RewardSystem) window.RewardSystem.resetErrors();

    currentStage = 1;
    currentSelection = { value: null, items: [] };
    
    const msg = document.getElementById('message');
    msg.innerText = ''; msg.style.background = 'transparent';
    document.getElementById('common-factors').innerHTML = '';
    document.getElementById('common-area').classList.add('hidden');
    document.getElementById('final-answer-area').classList.add('hidden');
    document.getElementById('verification-area').classList.add('hidden');
    document.getElementById('restart-btn').classList.add('hidden'); 
    
    let gcdInput = document.getElementById('gcd-input');
    gcdInput.value = ''; gcdInput.disabled = false; gcdInput.style.borderColor = 'var(--text-muted)';
    document.getElementById('gcd-submit-btn').classList.remove('hidden');
    
    const ctx = document.getElementById('confetti-canvas').getContext('2d');
    ctx.clearRect(0, 0, 750, 750);

    setInstruction('Шаг 1. 🎯 Заполни пустые слоты простыми множителями (в любом порядке)', 1);

    currentSet = sets[Math.floor(Math.random() * sets.length)];
    targetFactors = currentSet.map(n => getPrimeFactors(n));
    factorsArr = [];
    
    targetFactors.forEach(row => {
        let slots = Array(row.length).fill().map(() => ({value: null, matched: false, selected: false}));
        factorsArr.push(slots);
    });
    
    matchedFactors = [];
    expectedGCD = 1;
    let tempArr = targetFactors.map(row => [...row]);
    while(true) {
        let common = findCommonValue(tempArr);
        if(common) {
            expectedGCD *= common;
            tempArr.forEach(row => { row.splice(row.indexOf(common), 1); });
        } else break;
    }
    render();
  }

  function findCommonValue(arrays) {
    if (!arrays || arrays.length === 0) return null;
    let firstRow = arrays[0];
    for (let val of firstRow) {
        if (arrays.every(row => row.includes(val))) return val;
    }
    return null;
  }

  function render() {
    const board = document.getElementById('game-board');
    board.innerHTML = '';
    
    factorsArr.forEach((row, rowIndex) => {
      let rowDiv = document.createElement('div');
      rowDiv.className = 'row';
      
      let label = document.createElement('div');
      label.className = 'label';
      label.innerText = currentSet[rowIndex] + ' =';
      rowDiv.appendChild(label);
      
      let allFilled = true;

      row.forEach((factorObj, colIndex) => {
        if (factorObj.value !== null) {
            let span = document.createElement('span');
            let classes = 'factor';
            if (currentStage === 2) classes += ' clickable';
            if (factorObj.selected) classes += ' selected';
            if (factorObj.matched) classes += ' matched';
            span.className = classes;
            span.innerText = factorObj.value;
            
            if (currentStage === 2 && !factorObj.matched) {
                span.onclick = () => tryMatchManual(rowIndex, colIndex, factorObj.value);
            }
            rowDiv.appendChild(span);
        } else {
            allFilled = false;
            let input = document.createElement('input');
            input.type = 'number';
            input.className = 'slot-input';
            input.id = `slot-${rowIndex}-${colIndex}`;
            
            input.onchange = (e) => handleSlotInput(rowIndex, colIndex, e.target);
            input.onkeypress = (e) => { if (e.key === 'Enter') handleSlotInput(rowIndex, colIndex, e.target); };
            
            rowDiv.appendChild(input);
        }
        
        if (colIndex < row.length - 1) {
          let mul = document.createElement('span');
          mul.className = 'sign';
          mul.innerHTML = '&times;';
          rowDiv.appendChild(mul);
        }
      });

      if (currentStage === 1 && allFilled) {
          let check = document.createElement('span');
          check.className = 'check-icon';
          check.innerHTML = '&#10004;';
          rowDiv.appendChild(check);
      }
      board.appendChild(rowDiv);
    });
  }

  function handleSlotInput(r, c, inputEl) {
    let val = parseInt(inputEl.value);
    if (!val) return;

    if (!isPrime(val)) {
        showError(inputEl, "❌ В слоты подходят только простые числа! (2, 3, 5, 7...)");
        inputEl.value = '';
        return;
    }
    
    let targetCount = targetFactors[r].filter(n => n === val).length;
    let currentlyLocked = factorsArr[r].filter(obj => obj.value === val).length;

    if (targetCount === 0) {
        showError(inputEl, `❌ Число ${currentSet[r]} не делится на ${val}!`);
        inputEl.value = '';
        return;
    }

    if (currentlyLocked >= targetCount) {
        showError(inputEl, `❌ Все множители "${val}" для числа ${currentSet[r]} уже найдены!`);
        inputEl.value = '';
        return;
    }

    if (window.RewardSystem) window.RewardSystem.resetErrors();

    factorsArr[r][c].value = val;
    document.getElementById('message').innerText = ''; 
    document.getElementById('message').style.background = 'transparent';
    vibrate(20);
    render();
    
    setTimeout(() => {
        let nextInput = document.querySelector('#game-board .slot-input');
        if (nextInput) {
            nextInput.focus();
        } else {
            checkStage1Progress(); 
        }
    }, 50);
  }

  function showError(inputEl, text) {
      vibrate([50, 50, 50]); 
      inputEl.classList.add('wrong');
      setTimeout(() => inputEl.classList.remove('wrong'), 400);
      let msg = document.getElementById('message');
      msg.innerText = text;
      msg.style.color = 'var(--danger)';
      msg.style.background = 'rgba(255, 118, 117, 0.1)';
      
      if (window.RewardSystem) window.RewardSystem.registerError("gcd");
  }

  function checkStage1Progress() {
    let allComplete = factorsArr.every(row => row.every(obj => obj.value !== null));
    if (allComplete) {
      currentStage = 2;
      setInstruction('Шаг 2. ✨ Отлично! Выдели <b>все одинаковые</b> множители в <b>каждом</b> ряду 👇', 2);
      document.getElementById('common-area').classList.remove('hidden');
      render(); 
    }
  }

  function tryMatchManual(r, c, val) {
    let factor = factorsArr[r][c];
    if (factor.matched) return;
    
    const msg = document.getElementById('message');
    msg.innerText = ''; msg.style.background = 'transparent';

    let selIndex = currentSelection.items.findIndex(item => item.r === r && item.c === c);
    if (selIndex > -1) {
        factor.selected = false;
        currentSelection.items.splice(selIndex, 1);
        if (currentSelection.items.length === 0) currentSelection.value = null;
        vibrate(20);
        render(); return;
    }

    if (currentSelection.value !== null && currentSelection.value !== val) {
        currentSelection.items.forEach(item => factorsArr[item.r][item.c].selected = false);
        currentSelection = { value: val, items: [] };
    }

    let rowConflictIdx = currentSelection.items.findIndex(item => item.r === r);
    if (rowConflictIdx > -1) {
        factorsArr[r][currentSelection.items[rowConflictIdx].c].selected = false;
        currentSelection.items.splice(rowConflictIdx, 1);
    }

    currentSelection.value = val;
    currentSelection.items.push({r, c});
    factor.selected = true;
    vibrate(20);

    if (currentSelection.items.length === factorsArr.length) {
        vibrate([30, 50, 30]); 
        currentSelection.items.forEach(item => {
            factorsArr[item.r][item.c].matched = true;
            factorsArr[item.r][item.c].selected = false;
        });
        matchedFactors.push(val);
        currentSelection = { value: null, items: [] };
        updateCommonArea();
        checkIfDone();
    }
    render();
  }

  function updateCommonArea() {
    let area = document.getElementById('common-factors');
    let html = matchedFactors.map(f => `<span class="factor">${f}</span>`).join(' <span class="sign">&times;</span> ');
    area.innerHTML = html;
  }

  function checkIfDone() {
    let remainingUnmatched = factorsArr.map(row => row.filter(f => !f.matched).map(f => f.value));
    if (!findCommonValue(remainingUnmatched)) {
       document.getElementById('final-answer-area').classList.remove('hidden');
       let msg = document.getElementById('message');
       msg.innerText = '🔥 Все общие множители найдены! Вычисли их произведение.';
       msg.style.color = 'var(--primary)';
       msg.style.background = 'rgba(108, 92, 231, 0.1)';
       
       let eqSpan = document.getElementById('equation-display');
       if (matchedFactors.length > 0) {
           eqSpan.innerHTML = matchedFactors.join(' &times; ') + ' = ';
       } else {
           eqSpan.innerHTML = '1 = '; 
       }
       setTimeout(() => document.getElementById('gcd-input').focus(), 100);
    }
  }

  function checkGCD() {
    let inputEl = document.getElementById('gcd-input');
    let inputVal = parseInt(inputEl.value);
    let msg = document.getElementById('message');
    
    if (inputVal === expectedGCD) {
      if (window.RewardSystem) window.RewardSystem.resetErrors();

      msg.innerHTML = '🏆 <b>Отлично!</b> НОД = ' + expectedGCD + '. Теперь давай его проверим!';
      msg.style.color = 'var(--success)';
      msg.style.background = 'rgba(0, 184, 148, 0.1)';
      inputEl.style.borderColor = 'var(--success)';
      inputEl.disabled = true;
      document.getElementById('gcd-submit-btn').classList.add('hidden');
      vibrate([100, 50, 100]); 
      
      setTimeout(() => {
          setupVerification();
      }, 1000);
    } else {
      showError(inputEl, '❌ Ошибка в расчетах. Проверь умножение!');
    }
  }

  function setupVerification() {
      currentStage = 3;
      setInstruction('Шаг 3. 🕵️‍♂️ Проверка! Раздели каждое исходное число на найденный НОД.', 3);
      document.getElementById('verification-area').classList.remove('hidden');
      
      const vBoard = document.getElementById('verification-board');
      vBoard.innerHTML = '';
      
      currentSet.forEach((num, idx) => {
          let rDiv = document.createElement('div');
          rDiv.className = 'row';
          rDiv.style.minHeight = '50px';
          
          let lbl = document.createElement('div');
          lbl.className = 'label';
          lbl.style.width = '120px';
          lbl.innerHTML = `${num} &divide; ${expectedGCD} =`;
          
          let inp = document.createElement('input');
          inp.type = 'number';
          inp.className = 'slot-input';
          inp.id = `verif-${idx}`;
          inp.style.borderColor = 'var(--warning)';
          inp.style.color = 'var(--text-main)';
          inp.onchange = (e) => checkVerifInput(idx, e.target);
          inp.onkeypress = (e) => { if(e.key === 'Enter') checkVerifInput(idx, e.target); };
          
          let check = document.createElement('span');
          check.className = 'check-icon hidden';
          check.id = `verif-check-${idx}`;
          check.innerHTML = '&#10004;';
          
          rDiv.appendChild(lbl);
          rDiv.appendChild(inp);
          rDiv.appendChild(check);
          vBoard.appendChild(rDiv);
      });
      
      setTimeout(() => { document.getElementById('verif-0').focus(); }, 100);
  }

  function checkVerifInput(idx, inpEl) {
      let val = parseInt(inpEl.value);
      if(!val) return;
      let expected = currentSet[idx] / expectedGCD;
      
      if(val === expected) {
          if (window.RewardSystem) window.RewardSystem.resetErrors();

          inpEl.disabled = true;
          inpEl.style.borderColor = 'var(--success)';
          inpEl.style.color = 'var(--success)';
          inpEl.style.background = 'rgba(0, 184, 148, 0.1)';
          document.getElementById(`verif-check-${idx}`).classList.remove('hidden');
          
          let msg = document.getElementById('message');
          msg.innerText = ''; msg.style.background = 'transparent';
          vibrate(20);
          
          let nextInp = document.querySelector('#verification-board .slot-input:not(:disabled)');
          if(nextInp) {
              nextInp.focus();
          } else {
              finalizeGame();
          }
      } else {
          showError(inpEl, "❌ Ошибка при делении! Посчитай внимательнее.");
          inpEl.value = '';
      }
  }

  function finalizeGame() {
      currentStage = 4;
      setInstruction('🎉 Идеально! Тренажёр пройден.', 4);
      let msg = document.getElementById('message');
      msg.innerHTML = '🏆 <b>Блестяще!</b> НОД найден и успешно проверен!';
      msg.style.color = 'var(--success)';
      msg.style.background = 'rgba(0, 184, 148, 0.1)';
      document.getElementById('restart-btn').classList.remove('hidden');
      vibrate([100, 50, 100, 50, 200]); 
      fireConfetti();

      // Вызываем Лутбокс
      if (window.RewardSystem) {
          setTimeout(() => {
              window.RewardSystem.showWin("Нахождение НОД", "gcd");
          }, 1500);
      }
  }

  function fireConfetti() {
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
    
    let particles = [];
    const colors = ['#6C5CE7', '#00B894', '#FDCB6E', '#FF7675', '#0984E3'];
    
    for(let i=0; i<70; i++) {
      particles.push({
        x: canvas.width / 2,
        y: canvas.height / 2 + 50,
        r: Math.random() * 6 + 4,
        dx: Math.random() * 10 - 5,
        dy: Math.random() * -10 - 5,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      ctx.clearRect(0,0,canvas.width,canvas.height);
      particles.forEach((p) => {
        p.dy += 0.3; 
        p.x += p.dx;
        p.y += p.dy;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.fillStyle = p.color;
        ctx.fill();
      });
    }
    animate();
  }

  initGame();
</script>
