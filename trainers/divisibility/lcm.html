  .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(142, 68, 173, 0.4); }

  <button id="restart-btn" class="btn hidden" onclick="initGame()" style="background: var(--text-main); box-shadow: 0 6px 15px rgba(45, 52, 54, 0.3);">Новое задание 🎲</button>

<script>
  const sets = [
    [36, 54, 72], [12, 18, 24], [15, 20, 30], 
    [10, 15, 25], [14, 21, 28], [24, 36, 48]
  ];
  
  let currentSet = [];
  let targetFactors = []; 
  let factorsArr = [];    
  let baseIndex = -1;
  let addedFactors = [];
  let expectedLCM = 1;
  let currentStage = 1; 

  function vibrate(ms) { if ('vibrate' in navigator) navigator.vibrate(ms); }

  function isPrime(num) {
    if (num < 2) return false;
    for (let i = 2; i <= Math.sqrt(num); i++) {
      if (num % i === 0) return false;
    }
    return true;
  }

  function gcd(a, b) { return !b ? a : gcd(b, a % b); }
  function lcm(a, b) { return (a * b) / gcd(a, b); }

  function getPrimeFactors(num) {
    let factors = [];
    let d = 2;
    while (num >= 2) {
      if (num % d === 0) { factors.push(d); num /= d; } else { d++; }
    }
    return factors;
  }

  function setInstruction(htmlText, stage) {
    const instr = document.getElementById('instructions');
    instr.innerHTML = htmlText;
    
    instr.classList.remove('pop-anim');
    void instr.offsetWidth; 
    instr.classList.add('pop-anim');

    if (stage === 1) {
      instr.style.background = 'rgba(142, 68, 173, 0.1)';
      instr.style.color = 'var(--primary)';
      instr.style.borderColor = 'rgba(142, 68, 173, 0.4)';
    } else if (stage === 2) {
      instr.style.background = 'rgba(253, 203, 110, 0.15)';
      instr.style.color = '#d35400';
      instr.style.borderColor = 'var(--warning)';
    } else if (stage === 3 || stage === 5) {
      instr.style.background = 'rgba(0, 184, 148, 0.1)';
      instr.style.color = 'var(--success)';
      instr.style.borderColor = 'rgba(0, 184, 148, 0.4)';
    } else if (stage === 4) {
      instr.style.background = 'rgba(142, 68, 173, 0.1)';
      instr.style.color = 'var(--primary)';
      instr.style.borderColor = 'rgba(142, 68, 173, 0.4)';
    }
  }

  function initGame() {
    if (window.RewardSystem) window.RewardSystem.resetErrors();

    currentStage = 1;
    baseIndex = -1;
    addedFactors = [];
    
    const msg = document.getElementById('message');
    msg.innerText = ''; msg.style.background = 'transparent';
    document.getElementById('lcm-factors').innerHTML = '';
    document.getElementById('lcm-area').classList.add('hidden');
    document.getElementById('final-answer-area').classList.add('hidden');
    document.getElementById('verification-area').classList.add('hidden');
    document.getElementById('restart-btn').classList.add('hidden'); 
    
    let lcmInput = document.getElementById('lcm-input');
    lcmInput.value = ''; lcmInput.disabled = false; lcmInput.style.borderColor = 'var(--text-muted)';
    document.getElementById('lcm-submit-btn').classList.remove('hidden');
    
    const ctx = document.getElementById('confetti-canvas').getContext('2d');
    ctx.clearRect(0, 0, 750, 750);

    setInstruction('Шаг 1. 🎯 Заполни пустые слоты простыми множителями', 1);

    currentSet = sets[Math.floor(Math.random() * sets.length)];
    currentSet.sort(() => Math.random() - 0.5);
    
    targetFactors = currentSet.map(n => getPrimeFactors(n));
    factorsArr = [];
    
    targetFactors.forEach(row => {
        let slots = Array(row.length).fill().map(() => ({value: null, state: 'empty', isNeeded: false}));
        factorsArr.push(slots);
    });
    
    expectedLCM = currentSet.reduce((acc, val) => lcm(acc, val), 1);
    render();
  }

  function render() {
    const board = document.getElementById('game-board');
    board.innerHTML = '';
    
    factorsArr.forEach((row, rowIndex) => {
      let rowDiv = document.createElement('div');
      rowDiv.className = 'row';
      
      let label = document.createElement('div');
      label.className = 'label';
      label.id = 'label-' + rowIndex;
      label.innerText = currentSet[rowIndex] + ' =';
      
      if (currentStage === 2) {
        label.classList.add('interactive');
        label.onclick = () => selectBase(rowIndex);
      } else if (currentStage > 2 && rowIndex === baseIndex) {
        label.classList.add('base-selected');
      }
      
      rowDiv.appendChild(label);
      
      let allFilled = true;

      row.forEach((factorObj, colIndex) => {
        if (factorObj.value !== null) {
            let span = document.createElement('span');
            let classes = 'factor ' + factorObj.state;
            span.className = classes;
            span.innerText = factorObj.value;
            
            if (currentStage === 3 && factorObj.state === 'clickable') {
                span.onclick = () => tryAddFactor(rowIndex, colIndex, span);
            }
            rowDiv.appendChild(span);
        } else {
            allFilled = false;
            let input = document.createElement('input');
            input.type = 'number';
            input.className = 'slot-input';
            input.id = `slot-${rowIndex}-${colIndex}`;
            
            input.onchange = (e) => handleSlotInput(rowIndex, colIndex, e.target);
            input.onkeypress = (e) => { if (e.key === 'Enter') handleSlotInput(rowIndex, colIndex, e.target); };
            
            rowDiv.appendChild(input);
        }
        
        if (colIndex < row.length - 1) {
          let mul = document.createElement('span');
          mul.className = 'sign';
          mul.innerHTML = '&times;';
          rowDiv.appendChild(mul);
        }
      });

      if (currentStage === 1 && allFilled) {
          let check = document.createElement('span');
          check.className = 'check-icon';
          check.innerHTML = '&#10004;';
          rowDiv.appendChild(check);
      }
      board.appendChild(rowDiv);
    });
  }

  function handleSlotInput(r, c, inputEl) {
    let val = parseInt(inputEl.value);
    if (!val) return;

    if (!isPrime(val)) {
        showError(inputEl, "❌ В слоты подходят только простые числа! (2, 3, 5, 7...)");
        inputEl.value = '';
        return;
    }
    
    let targetCount = targetFactors[r].filter(n => n === val).length;
    let currentlyLocked = factorsArr[r].filter(obj => obj.value === val).length;

    if (targetCount === 0) {
        showError(inputEl, `❌ Число ${currentSet[r]} не делится на ${val}!`);
        inputEl.value = '';
        return;
    }

    if (currentlyLocked >= targetCount) {
        showError(inputEl, `❌ Все множители "${val}" для числа ${currentSet[r]} уже найдены!`);
        inputEl.value = '';
        return;
    }

    if (window.RewardSystem) window.RewardSystem.resetErrors();

    factorsArr[r][c].value = val;
    factorsArr[r][c].state = 'normal';
    document.getElementById('message').innerText = ''; 
    document.getElementById('message').style.background = 'transparent';
    vibrate(20);
    render();
    
    setTimeout(() => {
        let nextInput = document.querySelector('#game-board .slot-input');
        if (nextInput) {
            nextInput.focus();
        } else {
            checkStage1Progress(); 
        }
    }, 50);
  }

  function showError(inputEl, text) {
      vibrate([50, 50, 50]); 
      if(inputEl) {
          inputEl.classList.add('wrong');
          setTimeout(() => inputEl.classList.remove('wrong'), 400);
      }
      let msg = document.getElementById('message');
      msg.innerText = text;
      msg.style.color = 'var(--danger)';
      msg.style.background = 'rgba(255, 118, 117, 0.1)';

      if (window.RewardSystem) window.RewardSystem.registerError("lcm");
  }

  function checkStage1Progress() {
    let allComplete = factorsArr.every(row => row.every(obj => obj.value !== null));
    if (allComplete) {
      currentStage = 2;
      setInstruction('Шаг 2. 👑 Кликни по <b>наибольшему</b> числу слева — оно станет нашей Базой.', 2);
      render(); 
    }
  }

  function selectBase(rowIndex) {
    let maxVal = Math.max(...currentSet);
    if (currentSet[rowIndex] !== maxVal) {
      let label = document.getElementById('label-' + rowIndex);
      showError(label, '❌ Базой всегда выбираем самое большое число!');
      return;
    }

    vibrate(50);
    baseIndex = rowIndex;
    currentStage = 3;
    
    factorsArr[baseIndex].forEach(f => f.state = 'base');
    
    document.getElementById('message').innerText = ''; 
    document.getElementById('message').style.background = 'transparent';
    
    document.getElementById('lcm-area').classList.remove('hidden');
    
    let isMissingAny = recalcCoverage();
    updateLCMArea();
    render();

    if (!isMissingAny) {
        checkIfStage3Done();
    } else {
        setInstruction('Шаг 3. 🧩 Кликай по <b>недостающим</b> множителям в других рядах, чтобы добавить их к Базе.', 3);
    }
  }

  function recalcCoverage() {
      let currentAssembly = [];
      factorsArr[baseIndex].forEach(f => currentAssembly.push(f.value));
      addedFactors.forEach(val => currentAssembly.push(val));

      let anyNeeded = false;

      factorsArr.forEach((row, rowIndex) => {
          if (rowIndex === baseIndex) return;
          let pool = [...currentAssembly];
          
          row.forEach(f => {
              if (f.state === 'added') {
                  let idx = pool.indexOf(f.value);
                  if (idx > -1) pool.splice(idx, 1);
                  f.isNeeded = false; 
              } else {
                  let idx = pool.indexOf(f.value);
                  if (idx > -1) {
                      pool.splice(idx, 1);
                      f.isNeeded = false; 
                      f.state = 'normal';
                  } else {
                      f.isNeeded = true;  
                      f.state = 'clickable';
                      anyNeeded = true;
                  }
              }
          });
      });
      return anyNeeded;
  }

  function tryAddFactor(rowIndex, colIndex, btnElement) {
    let f = factorsArr[rowIndex][colIndex];
    
    if (f.isNeeded) {
      vibrate(20);
      f.state = 'added';
      addedFactors.push(f.value);
      addedFactors.sort((a, b) => a - b);
      
      let isMissingAny = recalcCoverage();
      updateLCMArea();
      render();
      
      if (!isMissingAny) checkIfStage3Done();
    } else {
      showError(btnElement, "❌ Этот множитель уже покрыт Базой!");
    }
  }

  function updateLCMArea() {
    let area = document.getElementById('lcm-factors');
    let baseVal = currentSet[baseIndex];
    let baseFactorsStr = factorsArr[baseIndex].map(f => f.value).join(' &times; ');

    let html = `<span style="color: var(--primary); font-size: 32px;">${baseVal}</span> <span style="font-size: 16px; color: var(--text-muted); vertical-align: middle;">(${baseFactorsStr})</span>`;

    if (addedFactors.length > 0) {
      html += ` <span class="sign" style="font-size: 32px;">&times;</span> ` + 
              addedFactors.map(v => `<span style="color: var(--success); font-size: 32px;">${v}</span>`).join(' <span class="sign" style="font-size: 32px;">&times;</span> ');
    }
    area.innerHTML = html;
  }

  function checkIfStage3Done() {
    currentStage = 4;
    setInstruction('Шаг 4. 🧮 Умножь Базу на добавленные множители и вычисли НОК.', 4);
    
    factorsArr.forEach(row => {
        row.forEach(f => {
            if (f.state === 'clickable') f.state = 'normal';
        });
    });
    render();
    
    document.getElementById('final-answer-area').classList.remove('hidden');
    setTimeout(() => document.getElementById('lcm-input').focus(), 100);
  }

  function checkLCM() {
    let inputEl = document.getElementById('lcm-input');
    let inputVal = parseInt(inputEl.value);
    let msg = document.getElementById('message');
    
    if (inputVal === expectedLCM) {
      if (window.RewardSystem) window.RewardSystem.resetErrors();

      msg.innerHTML = '🏆 <b>Отлично!</b> НОК = ' + expectedLCM + '. Теперь давай его проверим!';
      msg.style.color = 'var(--success)';
      msg.style.background = 'rgba(0, 184, 148, 0.1)';
      inputEl.style.borderColor = 'var(--success)';
      inputEl.disabled = true;
      document.getElementById('lcm-submit-btn').classList.add('hidden');
      vibrate([100, 50, 100]); 
      
      setTimeout(() => {
          setupVerification();
      }, 1000);
    } else {
      showError(inputEl, '❌ Ошибка в расчетах. Проверь умножение!');
    }
  }

  function setupVerification() {
      currentStage = 5;
      setInstruction('Шаг 5. 🕵️‍♂️ Проверка! Раздели найденный НОК на каждое исходное число.', 5);
      document.getElementById('verification-area').classList.remove('hidden');
      
      const vBoard = document.getElementById('verification-board');
      vBoard.innerHTML = '';
      
      currentSet.forEach((num, idx) => {
          let rDiv = document.createElement('div');
          rDiv.className = 'row';
          rDiv.style.minHeight = '50px';
          
          let lbl = document.createElement('div');
          lbl.className = 'label';
          lbl.style.width = '140px';
          lbl.innerHTML = `${expectedLCM} &divide; ${num} =`;
          
          let inp = document.createElement('input');
          inp.type = 'number';
          inp.className = 'slot-input';
          inp.id = `verif-${idx}`;
          inp.style.borderColor = 'var(--warning)';
          inp.style.color = 'var(--text-main)';
          inp.onchange = (e) => checkVerifInput(idx, e.target);
          inp.onkeypress = (e) => { if(e.key === 'Enter') checkVerifInput(idx, e.target); };
          
          let check = document.createElement('span');
          check.className = 'check-icon hidden';
          check.id = `verif-check-${idx}`;
          check.innerHTML = '&#10004;';
          
          rDiv.appendChild(lbl);
          rDiv.appendChild(inp);
          rDiv.appendChild(check);
          vBoard.appendChild(rDiv);
      });
      
      setTimeout(() => { document.getElementById('verif-0').focus(); }, 100);
  }

  function checkVerifInput(idx, inpEl) {
      let val = parseInt(inpEl.value);
      if(!val) return;
      let expected = expectedLCM / currentSet[idx];
      
      if(val === expected) {
          if (window.RewardSystem) window.RewardSystem.resetErrors();

          inpEl.disabled = true;
          inpEl.style.borderColor = 'var(--success)';
          inpEl.style.color = 'var(--success)';
          inpEl.style.background = 'rgba(0, 184, 148, 0.1)';
          document.getElementById(`verif-check-${idx}`).classList.remove('hidden');
          
          let msg = document.getElementById('message');
          msg.innerText = ''; msg.style.background = 'transparent';
          vibrate(20);
          
          let nextInp = document.querySelector('#verification-board .slot-input:not(:disabled)');
          if(nextInp) {
              nextInp.focus();
          } else {
              finalizeGame();
          }
      } else {
          showError(inpEl, "❌ Ошибка при делении! Посчитай внимательнее.");
          inpEl.value = '';
      }
  }

  function finalizeGame() {
      setInstruction('🎉 Идеально! Тренажёр пройден.', 5);
      let msg = document.getElementById('message');
      msg.innerHTML = '🏆 <b>Блестяще!</b> НОК найден и успешно проверен!';
      msg.style.color = 'var(--success)';
      msg.style.background = 'rgba(0, 184, 148, 0.1)';
      document.getElementById('restart-btn').classList.remove('hidden');
      vibrate([100, 50, 100, 50, 200]); 
      fireConfetti();

      // Вызов лутбокса
      if (window.RewardSystem) {
          setTimeout(() => {
              window.RewardSystem.showWin("Нахождение НОК", "lcm");
          }, 1500);
      }
  }

  function fireConfetti() {
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
    
    let particles = [];
    const colors = ['#8E44AD', '#00B894', '#FDCB6E', '#FF7675', '#0984E3'];
    
    for(let i=0; i<70; i++) {
      particles.push({
        x: canvas.width / 2,
        y: canvas.height / 2 + 50,
        r: Math.random() * 6 + 4,
        dx: Math.random() * 10 - 5,
        dy: Math.random() * -10 - 5,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      ctx.clearRect(0,0,canvas.width,canvas.height);
      particles.forEach((p) => {
        p.dy += 0.3; 
        p.x += p.dx;
        p.y += p.dy;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.fillStyle = p.color;
        ctx.fill();
      });
    }
    animate();
  }

  initGame();
</script>
