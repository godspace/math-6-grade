<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" href="/math-6-grade/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="16x16" href="/math-6-grade/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/math-6-grade/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/math-6-grade/favicon-48x48.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/math-6-grade/apple-touch-icon.png">
    <link rel="manifest" href="/math-6-grade/site.webmanifest">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер: Разложение на простые множители</title>
    <!-- Глобальный скрипт с аналитикой и системой наград -->
    <script src="../../assets/analytics.js" defer></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.5);
            --error: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 5px;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .level-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(139, 92, 246, 0.2);
            color: #c4b5fd;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: bold;
            border: 1px solid rgba(139, 92, 246, 0.3);
            margin-top: 10px;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.2);
        }

        /* Динамическая иконка-достижение (Favicon) */
        .achievement-icon {
            display: inline-block;
            width: 22px; 
            height: 22px;
            background-image: url('/math-6-grade/favicon.ico');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            margin-right: 8px;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* 6 уровней эволюции геймпада */
        .skin-0 { filter: grayscale(100%) opacity(0.6); } /* Разминка - Серый */
        .skin-1 { filter: hue-rotate(90deg) drop-shadow(0 0 5px var(--success)); } /* Зеленый */
        .skin-2 { filter: hue-rotate(180deg) drop-shadow(0 0 5px var(--primary)); } /* Синий */
        .skin-3 { filter: hue-rotate(270deg) drop-shadow(0 0 5px #a855f7); } /* Фиолетовый */
        .skin-4 { filter: hue-rotate(320deg) drop-shadow(0 0 8px #ef4444); } /* Красный */
        .skin-5 { filter: sepia(1) saturate(5) hue-rotate(10deg) drop-shadow(0 0 15px gold); transform: scale(1.2); } /* Золотой Босс */

        /* Игровое поле */
        .game-board {
            width: 100%;
            max-width: 700px;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden; 
        }

        /* Строка собранных множителей (Уравнение) */
        .factors-row {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            min-height: 80px;
            margin-bottom: 30px;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            width: 90%;
        }

        .factor-item {
            font-size: 2rem;
            font-weight: bold;
            color: var(--success);
            text-shadow: 0 0 10px var(--success-glow);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .active-target {
            color: white;
            background: rgba(59, 130, 246, 0.2);
            border: 2px dashed #3b82f6;
            padding: 5px 15px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
            animation: pulseTarget 2s infinite ease-in-out;
            text-shadow: none;
            transition: all 0.3s ease;
        }

        @keyframes pulseTarget {
            0%, 100% { transform: scale(1); border-color: rgba(59, 130, 246, 0.5); }
            50% { transform: scale(1.05); border-color: #3b82f6; box-shadow: 0 0 20px rgba(59, 130, 246, 0.6); }
        }

        .original-target {
            font-size: 2rem;
            font-weight: bold;
            color: var(--text-muted);
        }

        .multiply-sign {
            color: var(--text-muted);
            font-size: 1.5rem;
            animation: fadeIn 0.3s ease forwards;
            margin: 0 5px;
        }

        /* Целевое число и диаграмма */
        .target-container {
            width: 180px;
            height: 180px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .target-container.drag-over {
            background: rgba(59, 130, 246, 0.1);
            border-color: var(--primary);
            transform: scale(1.05);
            box-shadow: 0 0 30px var(--primary-glow);
        }

        .pie-background {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1;
        }

        .labels-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .sector-label {
            position: absolute;
            top: 50%; left: 50%;
            font-weight: 800;
            color: white;
            text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.8);
            transition: all 0.3s ease;
            animation: fadeIn 0.3s ease;
        }

        /* Анимации Успеха/Ошибки */
        @keyframes successPulse {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.2); filter: brightness(1.5); color: var(--success); text-shadow: 0 0 30px var(--success-glow); background: rgba(16, 185, 129, 0.2); border-color: var(--success); }
            100% { transform: scale(1); filter: brightness(1); }
        }
        
        @keyframes shakeError {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); color: var(--error); border-color: var(--error); background: rgba(239, 68, 68, 0.2); }
            40%, 80% { transform: translateX(10px); color: var(--error); border-color: var(--error); background: rgba(239, 68, 68, 0.2); }
        }

        .anim-success { animation: successPulse 0.6s ease; }
        .anim-error { animation: shakeError 0.5s ease; animation-iteration-count: 1; }

        /* Внутриигровой оверлей для математического вопроса */
        .quiz-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .quiz-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .quiz-title {
            color: var(--primary);
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .quiz-question {
            font-size: 3.5rem;
            font-weight: bold;
            color: white;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .quiz-input {
            width: 120px;
            font-size: 3rem;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            border: 2px dashed rgba(255, 255, 255, 0.5);
            color: white;
            border-radius: 16px;
            padding: 10px;
            outline: none;
            font-family: inherit;
            font-weight: bold;
            transition: all 0.2s;
        }

        .quiz-input:focus {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.1);
            box-shadow: 0 0 20px var(--success-glow);
        }

        .quiz-input::-webkit-outer-spin-button,
        .quiz-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .quiz-btn {
            margin-top: 30px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            transition: transform 0.2s;
        }

        .quiz-btn:hover {
            transform: scale(1.05);
        }

        /* Инвентарь */
        .inventory-hint {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            text-align: center;
        }

        .primes-inventory {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            transition: opacity 0.3s, transform 0.3s;
        }

        .prime-token {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            cursor: grab;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .prime-token:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(37, 99, 235, 0.6); }
        .prime-token:active { cursor: grabbing; transform: scale(0.95); }

        /* Кнопка перехода к следующему раунду */
        .next-round-container {
            display: none;
            margin-top: -10px;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .btn-next {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            transition: all 0.2s;
        }

        .btn-next:hover { transform: scale(1.05) translateY(-2px); box-shadow: 0 8px 25px rgba(16, 185, 129, 0.6); }

        /* Конфетти */
        .confetti-particle {
            position: absolute;
            width: 10px; height: 10px;
            border-radius: 2px;
            pointer-events: none;
            z-index: 999;
            animation: confettiBurst 1s ease-out forwards;
        }

        @keyframes confettiBurst {
            0% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) rotate(var(--rot)) scale(0); opacity: 0; }
        }

        /* Прогресс-бар */
        .progress-tracker {
            position: absolute;
            top: 20px;
            display: flex;
            gap: 8px;
        }

        .progress-dot {
            width: 12px; height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            transition: background 0.3s, box-shadow 0.3s;
        }

        .progress-dot.filled {
            background: var(--success);
            box-shadow: 0 0 10px var(--success-glow);
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media (max-width: 600px) {
            .target-container { width: 150px; height: 150px; }
            .factor-item, .original-target { font-size: 1.5rem; }
            .prime-token { width: 55px; height: 55px; font-size: 1.3rem; }
            .active-target { padding: 4px 10px; }
            .btn-next { font-size: 1.2rem; padding: 12px 30px; }
            .quiz-question { font-size: 2.5rem; }
            .quiz-input { width: 80px; font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Разложение на множители</h1>
        <div class="level-badge">
            <span class="achievement-icon skin-0" id="rank-icon"></span>
            <span id="level-indicator-text">Разминка</span>
        </div>
    </header>

    <div class="game-board" id="game-board">
        <div class="progress-tracker" id="progress-tracker">
            <!-- Точки прогресса -->
        </div>

        <div class="factors-row" id="factors-row">
            <!-- Уравнение рендерится здесь -->
        </div>

        <div class="target-container" id="target-zone">
            <div class="pie-background" id="pie-bg"></div>
            <div id="labels-container" class="labels-container"></div>
        </div>

        <div class="inventory-hint" id="hint-text">Перетащи множитель на круг или нажми</div>
        
        <div class="primes-inventory" id="inventory">
            <!-- Токены простых чисел -->
        </div>

        <div class="next-round-container" id="next-btn-container">
            <button class="btn-next" onclick="startNextRound()">Дальше ➔</button>
        </div>

        <!-- Оверлей для устного счета -->
        <div class="quiz-overlay" id="quiz-overlay">
            <div class="quiz-title">Отлично! А теперь посчитай:</div>
            <div class="quiz-question">
                <span id="quiz-dividend">12</span> : <span id="quiz-divisor">2</span> = <input type="number" id="quiz-input" class="quiz-input" autocomplete="off">
            </div>
            <button class="quiz-btn" onclick="submitQuiz()">Проверить</button>
        </div>
    </div>

    <script>
        const levels = [
            { name: "Разминка", primes: [2], min: 4, max: 16, factorsCount: [2, 3, 4], requiredWins: 3 },
            { name: "Двойки и Тройки", primes: [2, 3], min: 6, max: 27, factorsCount: [2, 3], requiredWins: 4 },
            { name: "Магия пятерки", primes: [2, 3, 5], min: 10, max: 50, factorsCount: [2, 3], requiredWins: 4 },
            { name: "Таблица на 7", primes: [2, 3, 5, 7], min: 14, max: 49, factorsCount: [2], requiredWins: 4 },
            { name: "Большие числа", primes: [2, 3, 5, 11, 13], min: 22, max: 65, factorsCount: [2], requiredWins: 3 },
            { name: "Босс-файт 💀", primes: [2, 3, 5, 7], min: 50, max: 210, factorsCount: [3, 4], requiredWins: 5 }
        ];

        let currentLevelIdx = 0;
        let winsInLevel = 0;
        let currentTarget = 0;
        let originalTarget = 0;
        let activeFactors = [];
        let isRoundOver = false;
        let pendingPrime = null;
        
        // Хранилище уже решенных чисел на текущем уровне для предотвращения повторов
        let usedNumbersForLevel = new Set();

        const gameBoard = document.getElementById('game-board');
        const targetZone = document.getElementById('target-zone');
        const pieBg = document.getElementById('pie-bg');
        const labelsContainer = document.getElementById('labels-container');
        const factorsRow = document.getElementById('factors-row');
        const inventory = document.getElementById('inventory');
        const hintText = document.getElementById('hint-text');
        const nextBtnContainer = document.getElementById('next-btn-container');
        const tracker = document.getElementById('progress-tracker');

        // Quiz elements
        const quizOverlay = document.getElementById('quiz-overlay');
        const quizDividend = document.getElementById('quiz-dividend');
        const quizDivisor = document.getElementById('quiz-divisor');
        const quizInput = document.getElementById('quiz-input');

        function isPrime(num) {
            if (num <= 1) return false;
            if (num <= 3) return true;
            if (num % 2 === 0 || num % 3 === 0) return false;
            for (let i = 5; i * i <= num; i += 6) {
                if (num % i === 0 || num % (i + 2) === 0) return false;
            }
            return true;
        }

        function initGame() {
            updateLevelUI();
            renderTracker();
            generateNewNumber();
            setupDropZone();
            
            quizInput.addEventListener('keyup', (e) => {
                if (e.key === 'Enter') submitQuiz();
            });
        }

        function updateLevelUI() {
            document.getElementById('level-indicator-text').textContent = levels[currentLevelIdx].name;
            document.getElementById('rank-icon').className = 'achievement-icon skin-' + currentLevelIdx;
            renderInventory();
        }

        function generateCandidate(level) {
            let num = 1;
            const factorsCount = level.factorsCount[Math.floor(Math.random() * level.factorsCount.length)];
            let forcedPrime = null;
            
            if ((currentLevelIdx === 3 || currentLevelIdx === 4) && Math.random() > 0.5) {
                forcedPrime = level.primes[level.primes.length - 1];
            }
            
            for(let i = 0; i < factorsCount; i++) {
                let randomPrime = (i === 0 && forcedPrime) ? forcedPrime : level.primes[Math.floor(Math.random() * level.primes.length)];
                num *= randomPrime;
            }
            return num;
        }

        function generateNewNumber() {
            if (window.RewardSystem) window.RewardSystem.resetErrors();
            
            const level = levels[currentLevelIdx];
            let num;
            let attempts = 0;
            const MAX_ATTEMPTS = 100;

            do {
                num = generateCandidate(level);
                attempts++;
                
                if (attempts > MAX_ATTEMPTS) {
                    usedNumbersForLevel.clear();
                    attempts = 0;
                }
                
            } while (
                num < level.min || 
                num > level.max || 
                usedNumbersForLevel.has(num)
            );

            usedNumbersForLevel.add(num);

            currentTarget = num;
            originalTarget = num;
            activeFactors = [];
            isRoundOver = false;
            
            inventory.style.display = 'flex';
            hintText.style.display = 'block';
            hintText.textContent = "Перетащи множитель на круг или нажми";
            hintText.style.color = "var(--text-muted)";
            nextBtnContainer.style.display = 'none';

            renderEquation(); 
            updatePieChart(); 
        }

        function renderEquation() {
            factorsRow.innerHTML = '';
            let htmlParts = [];
            
            activeFactors.forEach(factor => {
                htmlParts.push(`<span class="factor-item">${factor}</span>`);
                htmlParts.push(`<span class="multiply-sign">×</span>`);
            });
            
            if (isRoundOver) {
                htmlParts.push(`<span class="factor-item">${currentTarget}</span>`);
            } else {
                htmlParts.push(`<span class="factor-item active-target" id="active-target-el">${currentTarget}</span>`);
            }
            
            htmlParts.push(`<span class="multiply-sign">=</span>`);
            htmlParts.push(`<span class="original-target">${originalTarget}</span>`);
            
            factorsRow.innerHTML = htmlParts.join('');
        }

        function renderInventory() {
            inventory.innerHTML = '';
            const level = levels[currentLevelIdx];
            
            level.primes.forEach(prime => {
                const token = document.createElement('div');
                token.className = 'prime-token';
                token.textContent = prime;
                token.draggable = true;
                
                token.addEventListener('dragstart', (e) => {
                    if(isRoundOver) return;
                    e.dataTransfer.setData('text/plain', prime);
                    token.style.opacity = '0.5';
                });
                
                token.addEventListener('dragend', () => {
                    token.style.opacity = '1';
                    targetZone.classList.remove('drag-over');
                });

                token.addEventListener('click', () => tryDivide(prime));

                inventory.appendChild(token);
            });
        }

        function setupDropZone() {
            targetZone.addEventListener('dragover', (e) => {
                if(isRoundOver) return;
                e.preventDefault();
                targetZone.classList.add('drag-over');
            });

            targetZone.addEventListener('dragleave', () => {
                targetZone.classList.remove('drag-over');
            });

            targetZone.addEventListener('drop', (e) => {
                if(isRoundOver) return;
                e.preventDefault();
                targetZone.classList.remove('drag-over');
                const primeStr = e.dataTransfer.getData('text/plain');
                if (primeStr) {
                    tryDivide(parseInt(primeStr));
                }
            });
        }

        function updatePieChart() {
            labelsContainer.innerHTML = '';

            if (activeFactors.length === 0) {
                pieBg.style.background = 'rgba(59, 130, 246, 0.4)';
                
                const label = document.createElement('div');
                label.className = 'sector-label';
                label.textContent = originalTarget;
                label.style.transform = `translate(-50%, -50%)`;
                label.style.fontSize = '3rem';
                labelsContainer.appendChild(label);
                return;
            }

            const slicesCount = activeFactors.reduce((acc, val) => acc * val, 1);
            let stops = [];
            const step = 360 / slicesCount;
            const lineThickness = slicesCount > 30 ? 0.2 : (slicesCount > 10 ? 0.5 : 1.5);
            const colors = ['rgba(59, 130, 246, 0.4)', 'rgba(139, 92, 246, 0.4)', 'rgba(16, 185, 129, 0.4)'];
            
            const R = slicesCount > 15 ? 65 : 55; 
            const fontSize = slicesCount > 20 ? '0.7rem' : (slicesCount > 8 ? '1rem' : '1.5rem');

            for(let i = 0; i < slicesCount; i++) {
                const angleStart = i * step;
                const angleEnd = (i + 1) * step;
                const colorIdx = (slicesCount % 2 !== 0) ? (i % 3) : (i % 2);
                const color = colors[colorIdx];
                
                stops.push(`${color} ${angleStart}deg`);
                stops.push(`${color} ${angleEnd - lineThickness}deg`);
                stops.push(`rgba(255, 255, 255, 0.9) ${angleEnd - lineThickness}deg`);
                stops.push(`rgba(255, 255, 255, 0.9) ${angleEnd}deg`);

                const middleAngle = angleStart + (step / 2);
                const rad = middleAngle * (Math.PI / 180);
                
                const x = R * Math.sin(rad);
                const y = -R * Math.cos(rad);

                const label = document.createElement('div');
                label.className = 'sector-label';
                label.textContent = currentTarget; 
                label.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
                label.style.fontSize = fontSize;
                labelsContainer.appendChild(label);
            }
            
            pieBg.style.background = `conic-gradient(${stops.join(', ')})`;
            
            pieBg.style.transform = 'scale(1.08)';
            setTimeout(() => {
                pieBg.style.transform = 'scale(1)';
            }, 250);
        }

        function tryDivide(prime) {
            if (isRoundOver) return;
            const targetEl = document.getElementById('active-target-el');

            if (currentTarget % prime === 0) {
                pendingPrime = prime;
                showMathQuiz();
            } else {
                if (targetEl) {
                    targetEl.classList.remove('anim-error', 'anim-success');
                    void targetEl.offsetWidth;
                    targetEl.classList.add('anim-error');
                }
                if (navigator.vibrate) navigator.vibrate(200);
            }
        }

        function showMathQuiz() {
            quizDividend.textContent = currentTarget;
            quizDivisor.textContent = pendingPrime;
            quizInput.value = '';
            
            quizOverlay.classList.add('active');
            
            setTimeout(() => {
                quizInput.focus();
            }, 100);
        }

        function submitQuiz() {
            const answer = parseInt(quizInput.value);
            const expectedQuotient = currentTarget / pendingPrime;

            quizOverlay.classList.remove('active');

            if (answer === expectedQuotient) {
                applyDivision();
            } else {
                resetRoundWithError();
            }
        }

        function applyDivision() {
            if (window.RewardSystem) window.RewardSystem.resetErrors();

            const targetEl = document.getElementById('active-target-el');
            
            currentTarget = currentTarget / pendingPrime;
            activeFactors.push(pendingPrime);
            pendingPrime = null;
            
            updatePieChart();

            if (isPrime(currentTarget)) {
                isRoundOver = true;
            }

            if (targetEl) {
                targetEl.classList.remove('anim-error', 'anim-success');
                void targetEl.offsetWidth; 
                targetEl.classList.add('anim-success');
            }

            setTimeout(() => {
                renderEquation();

                if (isRoundOver) {
                    setTimeout(handleWin, 800); 
                }
            }, 300); 
        }

        function resetRoundWithError() {
            pendingPrime = null;
            currentTarget = originalTarget;
            activeFactors = [];
            isRoundOver = false;

            if (window.RewardSystem) window.RewardSystem.registerError('primes');

            gameBoard.classList.add('anim-error');
            setTimeout(() => gameBoard.classList.remove('anim-error'), 500);
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]); 

            updatePieChart();
            renderEquation();

            hintText.textContent = "Ошибка при вычислении! Число сброшено.";
            hintText.style.color = "var(--error)";
            
            setTimeout(() => {
                hintText.textContent = "Перетащи множитель на круг или нажми";
                hintText.style.color = "var(--text-muted)";
            }, 3000);
        }

        function renderTracker() {
            tracker.innerHTML = '';
            const required = levels[currentLevelIdx].requiredWins;
            for(let i=0; i<required; i++) {
                const dot = document.createElement('div');
                dot.className = `progress-dot ${i < winsInLevel ? 'filled' : ''}`;
                tracker.appendChild(dot);
            }
        }

        function fireConfetti() {
            const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899'];
            const rect = targetZone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            for (let i = 0; i < 60; i++) {
                const particle = document.createElement('div');
                particle.className = 'confetti-particle';
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.left = `${centerX}px`;
                particle.style.top = `${centerY}px`;
                
                const angle = Math.random() * Math.PI * 2;
                const velocity = 80 + Math.random() * 150;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity - 50; 
                const rot = Math.random() * 720;
                
                particle.style.setProperty('--tx', `${tx}px`);
                particle.style.setProperty('--ty', `${ty}px`);
                particle.style.setProperty('--rot', `${rot}deg`);
                
                document.body.appendChild(particle);
                
                setTimeout(() => particle.remove(), 1000);
            }
        }

        function handleWin() {
            winsInLevel++;
            renderTracker();
            
            inventory.style.display = 'none';
            hintText.style.display = 'none';
            nextBtnContainer.style.display = 'block';

            fireConfetti();

            if (winsInLevel >= levels[currentLevelIdx].requiredWins) {
                setTimeout(() => {
                    if (window.RewardSystem) {
                        window.RewardSystem.showWin("Разложение на множители", "primes");
                    }
                }, 1500);
            }
        }

        function startNextRound() {
            if (winsInLevel >= levels[currentLevelIdx].requiredWins) {
                if (currentLevelIdx < levels.length - 1) {
                    currentLevelIdx++;
                    winsInLevel = 0;
                    usedNumbersForLevel.clear(); 
                    updateLevelUI();
                } else {
                    winsInLevel = 0; 
                    usedNumbersForLevel.clear();
                }
                renderTracker();
            }
            
            generateNewNumber();
        }

        window.addEventListener('DOMContentLoaded', initGame);

    </script>
</body>
</html>
