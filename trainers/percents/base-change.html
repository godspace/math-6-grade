<script>
(function () {
    'use strict';

    // §22.4 «красивые числа»: генерируем от ответа, а не от условия.
    // Допустимые наборы — строго из таблицы; ответ, который не целый
    // и не конечная десятичная с ≤2 знаками, бракуется и пара берётся заново
    // (лимит попыток), последний рубеж — fallback-пара из таблицы.
    var PAIRS = [[5, 4], [10, 8], [4, 2], [5, 2], [5, 1]];
    var CUTS = [50, 75, 80, 90];
    var GROWTH = [1.5, 2, 2.5, 3, 5];

    var STORIES_CUT = [
        'Цену товара снизили на <b>{p}%</b>. Во сколько раз уменьшилась цена?',
        'Зарплату уменьшили на <b>{p}%</b>. Во сколько раз она уменьшилась?',
        'Время в пути сократили на <b>{p}%</b>. Во сколько раз сократилось время?',
        'Массу груза уменьшили на <b>{p}%</b>. Во сколько раз уменьшилась масса?'
    ];

    var STORIES_GROWTH = [
        'Зарплату увеличили в <b>{k}</b> {times}. На сколько процентов она выросла?',
        'Число подписчиков выросло в <b>{k}</b> {times}. На сколько процентов выросло число подписчиков?',
        'Цену товара повысили в <b>{k}</b> {times}. На сколько процентов выросла цена?',
        'Скорость поезда увеличили в <b>{k}</b> {times}. На сколько процентов выросла скорость?'
    ];

    var STORIES_MORE = [
        'Первый лыжник прошёл <b>{big}</b> км, второй — <b>{small}</b> км. Первый прошёл на <b>{more}%</b> больше второго. На сколько процентов второй прошёл меньше первого?',
        'В первом альбоме <b>{big}</b> наклеек, во втором — <b>{small}</b>. В первом на <b>{more}%</b> больше. На сколько процентов во втором альбоме меньше наклеек?',
        'Одна бригада сделала <b>{big}</b> деталей, другая — <b>{small}</b>. Первая сделала на <b>{more}%</b> больше. На сколько процентов вторая бригада сделала меньше?'
    ];

    var STORIES_LESS = [
        'Второй лыжник прошёл <b>{small}</b> км, первый — <b>{big}</b> км. Второй прошёл на <b>{less}%</b> меньше первого. На сколько процентов первый прошёл больше второго?',
        'Во втором альбоме <b>{small}</b> наклеек, в первом — <b>{big}</b>. Во втором на <b>{less}%</b> меньше. На сколько процентов в первом альбоме больше наклеек?',
        'Вторая бригада сделала <b>{small}</b> деталей, первая — <b>{big}</b>. Вторая сделала на <b>{less}%</b> меньше. На сколько процентов первая бригада сделала больше?'
    ];

    function fmt(value) {
        return String(Math.round(value * 100) / 100).replace('.', ',');
    }

    function timesWord(k) {
        if (Math.abs(k - Math.round(k)) > 1e-9) return 'раза';
        return Math.round(k) % 10 === 1 ? 'раз' : 'раза';
    }

    // Перегенерация брака: не более TrainerCore.MAX_TRIES попыток на пару
    function makeCut() {
        var fallback = null;
        for (var attempt = 0; attempt < TrainerCore.MAX_TRIES; attempt++) {
            var p = pickRandom(CUTS);
            var answer = 100 / (100 - p);
            if (!fallback) fallback = { p: p, answer: answer };
            if (TrainerCore.isNiceAnswer(answer)) return { p: p, answer: answer };
        }
        return fallback || { p: CUTS[0], answer: 100 / (100 - CUTS[0]) };
    }

    function makeGrowth() {
        var fallback = null;
        for (var attempt = 0; attempt < TrainerCore.MAX_TRIES; attempt++) {
            var k = pickRandom(GROWTH);
            var answer = (k - 1) * 100;
            if (!fallback) fallback = { k: k, answer: answer };
            if (TrainerCore.isNiceAnswer(answer)) return { k: k, answer: answer };
        }
        return fallback || { k: GROWTH[0], answer: (GROWTH[0] - 1) * 100 };
    }

    function makePair() {
        var fallback = null;
        for (var attempt = 0; attempt < TrainerCore.MAX_TRIES; attempt++) {
            var pair = pickRandom(PAIRS);
            var big = Math.max(pair[0], pair[1]);
            var small = Math.min(pair[0], pair[1]);
            var more = (big - small) / small * 100;
            var less = (big - small) / big * 100;
            if (!fallback) fallback = { big: big, small: small, more: more, less: less };
            if (TrainerCore.isNiceAnswer(more) && TrainerCore.isNiceAnswer(less)) {
                return { big: big, small: small, more: more, less: less };
            }
        }
        return fallback || { big: 5, small: 4, more: 25, less: 20 };
    }

    // --- Тип 3: снижение на p% → «во сколько раз» ---
    function taskCut() {
        var data = makeCut();
        var text = pickRandom(STORIES_CUT).replace('{p}', fmt(data.p));
        return {
            text: '<p>' + text + '</p>',
            answer: data.answer,
            unit: 'раз',
            explain: 'Новая величина — это ' + fmt(100 - data.p) + '% от старой, значит 100 : ' +
                fmt(100 - data.p) + ' = ' + fmt(data.answer) + '.',
            visual: { names: ['Было', 'Стало'], values: [100, 100 - data.p], base: 0 }
        };
    }

    // --- Тип 4: рост в k раз → «на сколько процентов» ---
    function taskGrowth() {
        var data = makeGrowth();
        var text = pickRandom(STORIES_GROWTH)
            .replace('{k}', fmt(data.k))
            .replace('{times}', timesWord(data.k));
        return {
            text: '<p>' + text + '</p>',
            answer: data.answer,
            unit: '%',
            explain: 'Было 100%, стало ' + fmt(data.k * 100) + '%, значит выросло на ' + fmt(data.answer) + '%.',
            visual: { names: ['Было', 'Стало'], values: [1, data.k], base: 0 }
        };
    }

    // --- Тип 1: «первый на p% больше» → «второй на сколько % меньше» ---
    function taskPairMore() {
        var data = makePair();
        var text = pickRandom(STORIES_MORE)
            .replace('{big}', fmt(data.big))
            .replace('{small}', fmt(data.small))
            .replace('{more}', fmt(data.more));
        return {
            text: '<p>' + text + '</p>',
            answer: data.less,
            unit: '%',
            explain: 'За 100% берём первый столбик: ' + fmt(data.big - data.small) + ' : ' +
                fmt(data.big) + ' × 100% = ' + fmt(data.less) + '%.',
            visual: { names: ['Первый', 'Второй'], values: [data.big, data.small], base: 0 }
        };
    }

    // --- Та же пара, но база переключена: «второй на q% меньше» → «первый на сколько % больше» ---
    function taskPairLess() {
        var data = makePair();
        var text = pickRandom(STORIES_LESS)
            .replace('{big}', fmt(data.big))
            .replace('{small}', fmt(data.small))
            .replace('{less}', fmt(data.less));
        return {
            text: '<p>' + text + '</p>',
            answer: data.more,
            unit: '%',
            explain: 'База переключена на второй столбик: ' + fmt(data.big - data.small) + ' : ' +
                fmt(data.small) + ' × 100% = ' + fmt(data.more) + '%.',
            visual: { names: ['Первый', 'Второй'], values: [data.big, data.small], base: 1 }
        };
    }

    // --- Визуал: два столбика + переключатель базы (перерисовывается на каждой задаче) ---
    function renderBars(task) {
        var host = document.getElementById('taskVisual');
        if (!host) return;
        var visual = task.visual;
        var max = Math.max.apply(null, visual.values.concat([1]));
        var bars = visual.values.map(function (value, index) {
            var height = Math.max(20, Math.round(Math.abs(value) / max * 168));
            return '<div class="bar-col' + (index === visual.base ? ' base' : '') + '">' +
                '<div class="bar" style="height:' + height + 'px"></div>' +
                '<div class="bar-name">' + visual.names[index] + '</div>' +
                '</div>';
        }).join('');
        var buttons = visual.names.map(function (name, index) {
            return '<button type="button" class="base-btn' + (index === visual.base ? ' active' : '') +
                '" data-base="' + index + '">' + name + '</button>';
        }).join('');
        host.innerHTML = '<div class="bars">' + bars + '</div>' +
            '<div class="base-switch"><span class="switch-label">За 100% принять:</span>' + buttons + '</div>';
    }

    function checkBaseChange(task, value) {
        return TrainerCore.close(value, task.answer);
    }

    var LEVELS = {
        1: { desc: 'Снижение на p% → «во сколько раз»', generate: taskCut },
        2: { desc: 'Рост в k раз → «на сколько %»', generate: taskGrowth },
        3: { desc: 'Больше на p% → меньше на ?%', generate: taskPairMore },
        4: { desc: 'Та же пара, база переключена', generate: taskPairLess },
        5: {
            desc: 'Смешанное задание',
            generate: function () { return pickRandom([taskCut, taskGrowth, taskPairMore, taskPairLess])(); }
        }
    };

    // Переключатель базы — учебный помощник: подсвечивает, какой столбик принят за 100%
    document.addEventListener('click', function (event) {
        var button = event.target.closest ? event.target.closest('.base-btn') : null;
        if (!button) return;
        var host = document.getElementById('taskVisual');
        if (!host) return;
        var index = Number(button.getAttribute('data-base'));
        var buttons = host.querySelectorAll('.base-btn');
        for (var i = 0; i < buttons.length; i++) buttons[i].classList.toggle('active', i === index);
        var columns = host.querySelectorAll('.bar-col');
        for (var j = 0; j < columns.length; j++) columns[j].classList.toggle('base', j === index);
    });

    TrainerCore.init({
        id: 'base_change',
        totalLevels: 5,
        guide: [
            'Сравниваем <b>две величины</b>: за 100% берём ту, с которой сравнивают (базу).',
            'Кнопки под столбиками показывают, какой столбик сейчас принят за 100%.',
            'Разница одна и та же, а проценты разные: <b>разница : база × 100%</b>.'
        ],
        level: function (level) {
            var current = LEVELS[level] || LEVELS[1];
            return {
                desc: current.desc,
                generate: current.generate,
                render: renderBars,
                check: checkBaseChange
            };
        }
    });
})();
</script>
