<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" href="/math-6-grade/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="16x16" href="/math-6-grade/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/math-6-grade/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/math-6-grade/favicon-48x48.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/math-6-grade/apple-touch-icon.png">
    <link rel="manifest" href="/math-6-grade/site.webmanifest">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мастер Долей: Блиц (5 заданий)</title>
    <style>
        :root {
            --primary: #4361ee;
            --success: #2ec4b6;
            --warning: #ff9f1c;
            --danger: #e71d36;
            --percent-color: #f72585;
            --bg-gradient: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
        }

        body {
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .container {
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 1100px;
            padding: 40px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            min-height: 550px;
        }

        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .level-badges { display: flex; gap: 10px; }
        .lvl-badge {
            width: 40px; height: 40px; border-radius: 50%; background: #ddd;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: #fff; font-size: 16px; transition: all 0.3s;
        }
        .lvl-badge.active { background: var(--primary); transform: scale(1.15); box-shadow: 0 0 15px var(--primary); }
        .lvl-badge.completed { background: var(--success); }

        .stats-box {
            background: #f8f9fa; padding: 10px 20px; border-radius: 12px;
            font-weight: bold; color: var(--primary);
        }

        h1 { margin: 0; color: #2d3436; font-size: 1.8rem; }
        .subtitle { color: #636e72; margin-top: 5px; }

        /* --- РАБОЧАЯ ОБЛАСТЬ --- */
        .work-area {
            display: flex; flex-direction: column; align-items: center; gap: 25px;
        }

        .fade-element {
            opacity: 0; transform: translateY(20px); transition: opacity 0.6s ease, transform 0.6s ease;
            pointer-events: none; display: none;
        }
        .fade-element.visible { opacity: 1; transform: translateY(0); pointer-events: auto; display: flex; }
        
        #inputSection.visible { display: flex; }

        .task-statement {
            background: #f8f9fa; padding: 25px; border-radius: 16px;
            text-align: center; font-size: 1.4rem; line-height: 1.6;
            border-left: 5px solid var(--primary); width: 90%; min-height: 80px;
            display: flex; align-items: center; justify-content: center;
        }
        
        .typing-cursor::after { content: '|'; animation: blink 1s infinite; color: var(--primary); }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        
        /* Визуализация */
        .visual-container {
            width: 80%; background: #fff; padding: 15px; border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; align-items: center;
        }
        canvas#visualCanvas { width: 100%; height: 60px; border-radius: 8px; background: #f0f0f0; }

        .highlight-percent { color: var(--percent-color); font-weight: bold; }
        .highlight-number { color: var(--primary); font-weight: bold; }
        .highlight-whole { color: #333; font-weight: bold; border-bottom: 2px solid #ccc; }

        .fraction-row {
            display: flex; align-items: center; gap: 15px; font-size: 2rem;
            font-weight: bold; flex-wrap: wrap; justify-content: center; margin-top: 10px;
        }
        .fraction { display: flex; flex-direction: column; align-items: center; width: 80px; }
        .frac-line { width: 100%; height: 4px; background: #333; border-radius: 2px; }
        .operator { font-size: 2.5rem; color: var(--primary); margin: 0 5px; }
        
        .step-label {
            width: 100%; text-align: center; font-size: 0.9rem; color: #777; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px;
        }

        .factor-input {
            width: 70px; height: 60px; font-size: 1.5rem; text-align: center;
            border: 2px solid #e0e0e0; border-radius: 12px; outline: none;
            transition: all 0.2s; font-weight: bold; color: #333; background: #fff;
            -moz-appearance: textfield;
        }
        .factor-input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.2); }
        .factor-input.live-cancelled { text-decoration: line-through; color: #aaa; border-color: transparent; opacity: 0.8; transform: scale(0.95); }
        
        .pair-color-0 { background-color: #f2f2f2; }
        .pair-color-1 { background-color: #e3f2fd; }
        .pair-color-2 { background-color: #fce4ec; }
        .pair-color-3 { background-color: #e8f5e9; }
        .pair-color-4 { background-color: #fff3e0; }

        .factor-input.correct { border-color: var(--success) !important; color: var(--success) !important; background: #e8f5e9 !important; }
        .factor-input.wrong { border-color: var(--danger) !important; background: #ffebeb !important; animation: shake 0.4s; }

        .factorization-area {
            background: #fff; padding: 15px; border-radius: 16px; border: 2px dashed #ccc;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .factors-container { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; min-height: 60px; }
        .big-fraction-line { width: 100%; height: 4px; background: linear-gradient(90deg, #ccc, #999, #ccc); border-radius: 2px; }

        .final-result-box {
            display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 10px;
            background: linear-gradient(to right, #f8f9fa, #fff); padding: 15px 30px;
            border-radius: 16px; border: 2px solid var(--percent-color);
        }
        .final-input {
            width: 120px; height: 60px; font-size: 1.8rem; text-align: center;
            border: 2px solid #ccc; border-radius: 12px; font-weight: bold; color: var(--percent-color);
        }
        .final-input.correct { border-color: var(--success); background-color: #e8f5e9; }
        .final-input.wrong { border-color: var(--danger); background-color: #ffebee; animation: shake 0.4s; }

        .btn {
            background: var(--primary); color: white; border: none; padding: 15px 40px;
            font-size: 1.2rem; border-radius: 50px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold; box-shadow: 0 10px 20px rgba(67, 97, 238, 0.3); margin: 0 10px;
        }
        .btn:hover { transform: translateY(-3px); }
        .btn-start { background: linear-gradient(45deg, #ff9f1c, #f39c12); display: none; }
        .btn-check { background: linear-gradient(45deg, var(--success), #20bf6b); display: none; }
        .btn-next { background: linear-gradient(45deg, var(--primary), #4834d4); display: none; }

        .feedback { height: 30px; font-weight: bold; text-align: center; opacity: 0; transition: opacity 0.3s; }
        .victory-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.98); z-index: 100; display: none;
            flex-direction: column; justify-content: center; align-items: center; text-align: center; animation: fadeIn 0.5s;
        }
        .trophy { font-size: 100px; margin-bottom: 20px; animation: bounce 2s infinite; }
        
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);} }
        @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }
        @keyframes bounce { 0%, 100% {transform: translateY(0);} 50% {transform: translateY(-20px);} }
        
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
        canvas#visualCanvas { position: relative; pointer-events: auto; }

    </style>
<script src="../../assets/analytics.js"></script>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h1>Мастер Долей</h1>
            <div class="subtitle" id="levelDescription">Задание 1 из 5</div>
        </div>
        <div class="level-badges">
            <div class="lvl-badge active" id="badge1">1</div>
            <div class="lvl-badge" id="badge2">2</div>
            <div class="lvl-badge" id="badge3">3</div>
            <div class="lvl-badge" id="badge4">4</div>
            <div class="lvl-badge" id="badge5">5</div>
        </div>
        <div class="stats-box">
            Счёт: <span id="score">0</span> | Ошибки: <span id="errors">0</span>
        </div>
    </div>

    <div class="work-area" id="workArea">
        
        <div class="visual-container">
            <canvas id="visualCanvas" width="600" height="80"></canvas>
        </div>

        <div class="task-statement fade-element visible" id="taskStatement"></div>
        
        <button class="btn btn-start" id="startBtn">Решить задачу ✏️</button>

        <div id="inputSection" class="fade-element" style="width: 100%; flex-direction: column; align-items: center;">
            
            <div class="step-label">Запиши дробь (Часть / Целое) и умножь на 100%</div>
            <div class="fraction-row">
                <div class="fraction">
                    <input type="number" class="factor-input" id="partNum" placeholder="?">
                    <div class="frac-line"></div>
                    <input type="number" class="factor-input" id="wholeDen" placeholder="?">
                </div>
                
                <div class="operator">×</div>
                
                <div class="fraction">
                    <input type="number" class="factor-input" id="mult100Num" placeholder="100">
                    <div class="frac-line"></div>
                    <input type="number" class="factor-input" id="mult1Den" placeholder="1">
                </div>
                
                <div class="operator">=</div>
                
                <div class="factorization-area" id="factorArea">
                    <div class="factors-container" id="numFactorsInputs"></div>
                    <div class="big-fraction-line"></div>
                    <div class="factors-container" id="denFactorsInputs"></div>
                </div>
            </div>
            
            <div style="width: 100%; border-bottom: 2px dashed #eee; margin: 20px 0;"></div>

            <div class="final-result-box">
                <div class="answer-label" style="font-size: 1.1rem; color: #333;">Итоговый процент:</div>
                <div style="display:flex; align-items:center; gap:5px;">
                    <input type="number" class="final-input" id="finalResultInt" placeholder="?">
                    <span style="font-size: 2rem; color: var(--percent-color); font-weight:bold;">%</span>
                </div>
            </div>
        </div>
    </div>

    <div style="text-align: center; margin-top: 30px;">
        <div class="feedback" id="feedbackMsg"></div>
        <br>
        <button class="btn btn-check" id="checkBtn">Проверить</button>
        <button class="btn btn-next" id="nextBtn">Следующее задание ➡</button>
    </div>

    <div class="victory-modal" id="victoryScreen">
        <canvas id="confettiCanvas"></canvas>
        <div class="trophy">🏆</div>
        <div class="cert-title">СЕРТИФИКАТ МАСТЕРА</div>
        <h2>Все 5 заданий выполнены!</h2>
        <div class="cert-stats">
            <div>Верных решений: <span id="finalScore" style="color:var(--success)">0</span></div>
            <div>Ошибок: <span id="finalErrors" style="color:var(--danger)">0</span></div>
        </div>
        <br>
        <button class="btn" onclick="location.reload()">Начать заново</button>
    </div>
</div>

<script>
// Всего 5 уровней, по 1 задаче на каждый уровень
const LEVELS = {
    1: { name: "Задание 1", desc: "Простые доли (из 25, 50)" },
    2: { name: "Задание 2", desc: "Крупные числа (из 200, 500)" },
    3: { name: "Задание 3", desc: "Внимание к деталям (остаток)" },
    4: { name: "Задание 4", desc: "Изменение цены (рост)" },
    5: { name: "Задание 5", desc: "Финальное испытание" }
};

// ТИПЫ ЗАДАЧ (Templates)
const TEMPLATES_DIRECT = [
    "Из <span class='highlight-whole'>{whole}</span> выстрелов стрелок попал в мишень <span class='highlight-number'>{target}</span> раз. Каков процент его попаданий?",
    "В тесте <span class='highlight-whole'>{whole}</span> вопросов. Ты ответил верно на <span class='highlight-number'>{target}</span>. Какой твой результат в процентах?",
    "В классе <span class='highlight-whole'>{whole}</span> учеников, из них <span class='highlight-number'>{target}</span> — девочки. Какой процент девочек в классе?",
    "Из <span class='highlight-whole'>{whole}</span> дней отпуска было <span class='highlight-number'>{target}</span> солнечных. Какой процент солнечных дней?"
];

const TEMPLATES_REMAINDER = [
    "В саду растёт <span class='highlight-whole'>{whole}</span> деревьев: <span class='highlight-number'>{given}</span> яблонь и остальные — груши. Какой процент составляют <b>груши</b>?",
    "Книга стоит <span class='highlight-whole'>{whole}</span> рублей. Ты заплатил <span class='highlight-number'>{given}</span> бонусами, а остальное деньгами. Какой процент ты заплатил деньгами?",
    "На диске <span class='highlight-whole'>{whole}</span> Гб. Фильмы занимают <span class='highlight-number'>{given}</span> Гб, остальное свободно. Какой процент свободен?"
];

const TEMPLATES_CHANGE = [
    "Цена товара выросла с <span class='highlight-whole'>{whole}</span> рублей до <span class='highlight-number'>{given}</span> рублей. На сколько процентов выросла цена?",
    "Было <span class='highlight-whole'>{whole}</span> подписчиков, стало <span class='highlight-number'>{given}</span>. На сколько процентов выросло число подписчиков?",
    "Спортсмен прыгал на <span class='highlight-whole'>{whole}</span> см, а теперь прыгает на <span class='highlight-number'>{given}</span> см. На сколько процентов улучшился результат?"
];

let state = {
    level: 1,
    tasksCompletedInLevel: 0,
    tasksToAdvance: 1, // 1 задача на уровень = 5 задач всего
    score: 0,
    errors: 0,
    currentTask: null,
    animationId: null,
    timeouts: []
};

function clearTimeouts() { state.timeouts.forEach(t => clearTimeout(t)); state.timeouts = []; }
function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function primeFactors(n) {
    const factors = [];
    if (n === 1) return [1];
    let d = 2, temp = n;
    while (d * d <= temp) { while (temp % d === 0) { factors.push(d); temp /= d; } d++; }
    if (temp > 1) factors.push(temp);
    return factors;
}

function generateTask() {
    const lvl = state.level;
    let whole, part, text, targetPart;
    let percent = 0;

    // Сложность по уровням
    let possibleDenominators = [];
    if (lvl === 1) possibleDenominators = [4, 5, 10, 20, 25, 50]; 
    else if (lvl === 2) possibleDenominators = [200, 300, 400, 500];
    else possibleDenominators = [20, 40, 50, 80, 100]; // Для 3, 4, 5

    whole = pickRandom(possibleDenominators);
    
    let valid = false;
    while (!valid) {
        percent = getRandomInt(5, 95);
        if ((whole * percent) % 100 === 0) {
            targetPart = (whole * percent) / 100;
            valid = true;
        }
    }

    // Выбор типа задачи
    if (lvl === 1 || lvl === 2) {
        text = pickRandom(TEMPLATES_DIRECT).replace('{whole}', whole).replace('{target}', targetPart);
        part = targetPart;
    } 
    else if (lvl === 3) {
        let given = whole - targetPart;
        text = pickRandom(TEMPLATES_REMAINDER).replace('{whole}', whole).replace('{given}', given);
        part = targetPart;
    }
    else if (lvl === 4) {
        let given = whole + targetPart;
        text = pickRandom(TEMPLATES_CHANGE).replace('{whole}', whole).replace('{given}', given);
        part = targetPart; 
    }
    else {
        // 5-й уровень: случайная сложная задача (3 или 4 тип)
        const type = Math.random() > 0.5 ? 'rem' : 'change';
        if(type === 'rem') {
            let given = whole - targetPart;
            text = pickRandom(TEMPLATES_REMAINDER).replace('{whole}', whole).replace('{given}', given);
            part = targetPart;
        } else {
            let given = whole + targetPart;
            text = pickRandom(TEMPLATES_CHANGE).replace('{whole}', whole).replace('{given}', given);
            part = targetPart; 
        }
    }

    let numFactors = primeFactors(part).concat(primeFactors(100)); numFactors.sort((a,b) => a-b);
    let denFactors = primeFactors(whole); denFactors.sort((a,b) => a-b);

    state.currentTask = {
        text, whole, part, percentResult: percent,
        numFactors, denFactors
    };
    
    renderTask();
}

function renderTask() {
    const t = state.currentTask;
    
    document.getElementById('levelDescription').textContent = `${LEVELS[state.level].desc}`;
    
    for(let i = 1; i <= 5; i++) {
        const b = document.getElementById(`badge${i}`);
        b.className = 'lvl-badge';
        if(i < state.level) b.classList.add('completed');
        if(i === state.level) b.classList.add('active');
    }
    
    createInputs('numFactorsInputs', t.numFactors.length);
    createInputs('denFactorsInputs', t.denFactors.length);
    clearAllInputs();
    
    document.getElementById('checkBtn').style.display = 'none';
    document.getElementById('nextBtn').style.display = 'none';
    setFeedback("");
    
    document.getElementById('taskStatement').innerHTML = "";
    animateTaskIntro();
}

function drawFrame(currentProgress) {
    const canvas = document.getElementById('visualCanvas');
    const ctx = canvas.getContext('2d');
    const w = canvas.width; const h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    
    const padding = 20; const barH = 30; const barY = (h - barH) / 2; const drawW = w - padding * 2;
    
    // Целое
    ctx.fillStyle = '#e0e0e0';
    ctx.beginPath(); ctx.roundRect(padding, barY, drawW, barH, 5); ctx.fill();
    
    // Часть
    const realRatio = state.currentTask.part / state.currentTask.whole;
    const animRatio = realRatio * currentProgress;
    const fillW = drawW * animRatio;
    
    if (fillW > 0) {
        ctx.fillStyle = '#4361ee'; ctx.beginPath(); ctx.roundRect(padding, barY, fillW, barH, 5); ctx.fill();
    }
    
    ctx.fillStyle = '#333'; ctx.font = 'bold 16px "Segoe UI"'; ctx.textAlign = 'center';
    ctx.fillText(state.currentTask.whole + " (всего)", padding + drawW, barY + barH + 20);
    
    if (currentProgress > 0.1) {
        let xPos = padding + fillW;
        if(xPos < padding + 20) xPos = padding + 20;
        ctx.fillStyle = '#4361ee';
        ctx.fillText(`${state.currentTask.part} (?%)`, xPos, barY - 10);
        ctx.beginPath(); ctx.moveTo(xPos, barY - 5); ctx.lineTo(xPos, barY);
        ctx.strokeStyle = '#4361ee'; ctx.lineWidth = 2; ctx.stroke();
    }
}

function typeWriterHTML(html, elementId, speed, callback) {
    const el = document.getElementById(elementId);
    el.innerHTML = ""; el.classList.add('typing-cursor');
    let i = 0;
    function type() {
        if (i >= html.length) { el.classList.remove('typing-cursor'); if(callback) callback(); return; }
        const char = html.charAt(i);
        if (char === '<') {
            let tag = '';
            while (html.charAt(i) !== '>' && i < html.length) { tag += html.charAt(i); i++; }
            tag += '>'; i++; el.innerHTML += tag; type();
        } else { el.innerHTML += char; i++; state.timeouts.push(setTimeout(type, speed)); }
    }
    type();
}

function animateTaskIntro() {
    const inputsEl = document.getElementById('inputSection');
    const startBtn = document.getElementById('startBtn');
    
    inputsEl.classList.remove('visible');
    startBtn.style.display = 'none';
    if (state.animationId) cancelAnimationFrame(state.animationId);
    clearTimeouts();
    
    let progress = 0;
    function step() {
        progress += 0.02;
        if (progress >= 1) {
            progress = 1;
            drawFrame(progress);
            typeWriterHTML(state.currentTask.text, 'taskStatement', 25, () => {
                startBtn.style.display = 'inline-block';
            });
        } else {
            drawFrame(progress);
            state.animationId = requestAnimationFrame(step);
        }
    }
    step();
}

document.getElementById('startBtn').addEventListener('click', function() {
    this.style.display = 'none';
    document.getElementById('inputSection').classList.add('visible');
    document.getElementById('checkBtn').style.display = 'inline-block';
});

function createInputs(containerId, count) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    if (count === 0) {
        const input = document.createElement('input'); input.type = 'number'; input.className = 'factor-input';
        container.appendChild(input); return;
    }
    for(let i = 0; i < count; i++) {
        const input = document.createElement('input'); input.type = 'number'; input.className = 'factor-input';
        input.addEventListener('input', updateLiveCancellation);
        container.appendChild(input);
        if (i < count - 1) {
            const span = document.createElement('span'); span.textContent = '×';
            span.style.color = '#777'; span.style.fontSize = '1.5rem'; span.style.margin = '0 5px'; container.appendChild(span);
        }
    }
}

function clearAllInputs() {
    const inputs = document.querySelectorAll('#workArea input');
    inputs.forEach(i => {
        // Сброс значений (кроме 100 и 1, если они используются по умолчанию)
        if(i.id !== 'mult100Num' && i.id !== 'mult1Den') {
             i.value = ''; 
        }
        i.classList.remove('correct', 'wrong', 'live-cancelled'); i.style.backgroundColor = '';
    });
    // Явно задаем 100 и 1 для удобства, но не блокируем
    document.getElementById('mult100Num').value = '100';
    document.getElementById('mult1Den').value = '1';
}

function updateLiveCancellation() {
    const nInputs = Array.from(document.querySelectorAll('#numFactorsInputs .factor-input'));
    const dInputs = Array.from(document.querySelectorAll('#denFactorsInputs .factor-input'));
    
    [...nInputs, ...dInputs].forEach(inp => {
        inp.classList.remove('live-cancelled', 'pair-color-0', 'pair-color-1', 'pair-color-2', 'pair-color-3', 'pair-color-4');
        inp.style.backgroundColor = '';
    });
    
    let colorIndex = 0;
    const dTakenIndices = new Set();
    
    nInputs.forEach((nInp) => {
        const nVal = parseInt(nInp.value);
        if (isNaN(nVal) || nVal === 1) return;
        
        for (let dIndex = 0; dIndex < dInputs.length; dIndex++) {
            if (dTakenIndices.has(dIndex)) continue;
            const dVal = parseInt(dInputs[dIndex].value);
            if (nVal === dVal) {
                dTakenIndices.add(dIndex);
                const colorClass = `pair-color-${colorIndex % 5}`;
                nInp.classList.add('live-cancelled', colorClass);
                dInputs[dIndex].classList.add('live-cancelled', colorClass);
                colorIndex++; break;
            }
        }
    });
}

document.getElementById('checkBtn').addEventListener('click', checkAnswer);
document.getElementById('nextBtn').addEventListener('click', nextTask);

function checkField(id, expected) {
    const el = document.getElementById(id);
    const val = parseFloat(el.value);
    if (val === expected) { el.classList.add('correct'); return true; }
    else { el.classList.add('wrong'); return false; }
}

function checkAnswer() {
    const t = state.currentTask;
    let allCorrect = true;
    
    // Проверка дроби: Часть / Целое
    if (!checkField('partNum', t.part)) allCorrect = false;
    if (!checkField('wholeDen', t.whole)) allCorrect = false;

    // Проверка множителя: 100 / 1
    if (!checkField('mult100Num', 100)) allCorrect = false;
    if (!checkField('mult1Den', 1)) allCorrect = false;
    
    // Факторы
    const userNumInputs = document.querySelectorAll('#numFactorsInputs .factor-input');
    const userNumVals = Array.from(userNumInputs).map(i => parseFloat(i.value) || 1).sort((a,b)=>a-b);
    const userDenInputs = document.querySelectorAll('#denFactorsInputs .factor-input');
    const userDenVals = Array.from(userDenInputs).map(i => parseFloat(i.value) || 1).sort((a,b)=>a-b);
    
    if (JSON.stringify(userNumVals) === JSON.stringify(t.numFactors)) userNumInputs.forEach(i => i.classList.add('correct'));
    else { userNumInputs.forEach(i => i.classList.add('wrong')); allCorrect = false; }
    
    if (JSON.stringify(userDenVals) === JSON.stringify(t.denFactors)) userDenInputs.forEach(i => i.classList.add('correct'));
    else { userDenInputs.forEach(i => i.classList.add('wrong')); allCorrect = false; }
    
    // Итоговый процент
    if (!checkField('finalResultInt', t.percentResult)) allCorrect = false;

    if (allCorrect) {
        setFeedback("Верно! 🎯", "success");
        state.score++; state.tasksCompletedInLevel++;
        document.getElementById('score').textContent = state.score;
        document.getElementById('checkBtn').style.display = 'none';
        
        if (state.tasksCompletedInLevel >= state.tasksToAdvance) {
            document.getElementById('nextBtn').textContent = state.level < 5 ? "Следующее задание ➡" : "Получить сертификат! 🏆";
        } else {
            document.getElementById('nextBtn').textContent = "Дальше ➡";
        }
        document.getElementById('nextBtn').style.display = 'inline-block';
    } else {
        state.errors++;
        document.getElementById('errors').textContent = state.errors;
        
        if (state.level >= 3 && state.level <= 5) {
             // Проверка на частую ошибку (путаница часть/целое или остаток)
             if (parseFloat(document.getElementById('partNum').value) === (t.whole - t.part)) {
                 setFeedback("Ошибка: нужно найти процент другого множества (остатка/разницы).", "error");
             } else {
                 setFeedback("Ошибка. Проверь, правильно ли выбрана часть и целое.", "error");
             }
        } else {
             setFeedback("Ошибка. Часть дели на Целое и умножай на 100.", "error");
        }
    }
}

function nextTask() {
    if (state.tasksCompletedInLevel >= state.tasksToAdvance) {
        if (state.level === 5) { showVictory(); return; }
        state.level++; state.tasksCompletedInLevel = 0;
    }
    generateTask();
}

function setFeedback(msg, type) {
    const el = document.getElementById('feedbackMsg');
    el.textContent = msg; el.style.opacity = 1;
    el.style.color = type === 'error' ? '#e71d36' : '#2ec4b6';
}

function showVictory() {
    document.getElementById('victoryScreen').style.display = 'flex';
    document.getElementById('finalScore').textContent = state.score;
    document.getElementById('finalErrors').textContent = state.errors;
    startConfetti();
}

function startConfetti() {
    const canvas = document.getElementById('confettiCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const pieces = []; const colors = ['#4361ee', '#f72585', '#2ec4b6', '#ff9f1c'];
    for(let i=0; i<300; i++) {
        pieces.push({
            x: Math.random()*canvas.width, y: Math.random()*canvas.height-canvas.height,
            color: colors[Math.floor(Math.random()*colors.length)],
            size: Math.random()*10+5, speed: Math.random()*5+2,
            angle: Math.random()*Math.PI*2, spin: Math.random()*0.2-0.1
        });
    }
    function animate() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        pieces.forEach(p => {
            p.y+=p.speed; p.angle+=p.spin; p.x+=Math.sin(p.angle)*2;
            if(p.y>canvas.height) p.y=-20;
            ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.angle);
            ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size); ctx.restore();
        });
        requestAnimationFrame(animate);
    }
    animate();
}

generateTask();
</script>
