</head>
<body>

<span id="text-measurer" aria-hidden="true"></span>
<div id="selection-marquee" aria-hidden="true"></div>

<button id="sidebar-toggle" aria-label="Открыть инструменты" aria-controls="sidebar" aria-expanded="false">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
</button>

<div id="sidebar-overlay" aria-hidden="true"></div>

<aside id="sidebar" aria-label="Инструменты доски">
    <h1 style="font-size:0.95rem;font-weight:800;line-height:1.3;margin:0;text-align:center;text-transform:uppercase;letter-spacing:0.04em;color:var(--primary-color)">Конструктор дробей: интерактивная доска</h1>
    <div>
        <div class="section-title">Числа и Переменные</div>
        <div class="tools-grid full">
            <button type="button" class="palette-item" data-type="number" aria-label="Число">123</button>
            <div class="tools-grid">
                <button type="button" class="palette-item" data-type="var" data-val="x" aria-label="Переменная x">
                    <span style="font-family: 'Cambria Math', serif; font-style: italic;">x</span>
                </button>
                <button type="button" class="palette-item" data-type="fraction" aria-label="Обыкновенная дробь">
                    <span class="preview-fraction"><span>a</span><span>b</span></span>
                </button>
            </div>
            <button type="button" class="palette-item" data-type="mixed" aria-label="Смешанная дробь">
                <span style="font-size: 0.8em; margin-right: 4px;">1</span>
                <span class="preview-fraction"><span>1</span><span>2</span></span>
            </button>
        </div>
    </div>

    <div>
        <div class="section-title">Счёт столбиком</div>
        <div class="tools-grid three">
            <button type="button" class="palette-item palette-col-item" data-type="col-add" title="Сложение и вычитание столбиком" aria-label="Сложение и вычитание столбиком">
                <span class="col-icon">±</span>
                <span>Столбик</span>
            </button>
            <button type="button" class="palette-item palette-col-item" data-type="col-mul" title="Умножение столбиком" aria-label="Умножение столбиком">
                <span class="col-icon">×</span>
                <span>Умнож.</span>
            </button>
            <button type="button" class="palette-item palette-col-item" data-type="col-div" title="Деление уголком" aria-label="Деление уголком">
                <span class="col-icon">÷</span>
                <span>Уголок</span>
            </button>
        </div>
    </div>

    <div>
        <div class="section-title">Степени и корни</div>
        <div class="tools-grid">
            <button type="button" class="palette-item" data-type="power" aria-label="Степень">
                <span style="font-style: italic;">x</span>
                <span style="font-size: 0.65em; position: relative; top: -8px; left: 1px; font-weight: 800;">y</span>
            </button>
            <button type="button" class="palette-item" data-type="frac-power" aria-label="Степень дроби">
                <span style="font-weight: normal;">(</span>
                <span class="preview-fraction" style="font-size: 0.6em; margin: 0 2px;"><span>a</span><span>b</span></span>
                <span style="font-weight: normal;">)</span>
                <span style="font-size: 0.65em; position: relative; top: -12px; font-weight: 800;">x</span>
            </button>
            <button type="button" class="palette-item" data-type="sqrt" aria-label="Квадратный корень">
                <span>√x</span>
            </button>
        </div>
    </div>

    <div>
        <div class="section-title">Операции</div>
        <div class="tools-grid">
            <button type="button" class="palette-item" data-type="op" data-val="+" aria-label="Плюс">+</button>
            <button type="button" class="palette-item" data-type="op" data-val="-" aria-label="Минус">−</button>
            <button type="button" class="palette-item" data-type="op-mul" data-val="×" aria-label="Умножить"><span style="font-size: 0.8em;">×</span></button>
            <button type="button" class="palette-item" data-type="op" data-val=":" aria-label="Разделить">:</button>
            <button type="button" class="palette-item" data-type="op" data-val="=" aria-label="Равно">=</button>
        </div>
    </div>

    <div>
        <div class="section-title">Группировка</div>
        <div class="tools-grid">
            <button type="button" class="palette-item" data-type="text" data-val="(" aria-label="Открывающая скобка">(</button>
            <button type="button" class="palette-item" data-type="text" data-val=")" aria-label="Закрывающая скобка">)</button>
        </div>
    </div>

    <div>
        <div class="section-title">Визуал</div>
        <div class="tools-grid full">
            <button type="button" class="palette-item" data-type="fraction-bar" style="font-family: 'Inter', sans-serif; font-size: 0.9rem;" aria-label="Общая черта дроби">
                ➖ Общая черта
            </button>
            <button type="button" class="palette-item" data-type="segment" style="font-family: 'Inter', sans-serif; font-size: 0.9rem;" aria-label="Блок отрезков">
                📏 Блок отрезков
            </button>
        </div>
    </div>
    
    <button class="action-btn btn-reset" data-action="reset-view">🎯 Центр камеры</button>
    <button class="action-btn btn-danger" data-action="clear-all">🗑 Очистить всё</button>
</aside>

<div id="viewport">
    <div id="grid-bg" aria-hidden="true"></div> 
    <div id="empty-state">Нажмите на инструмент слева,<br>чтобы добавить его на доску</div>

    <div id="group-toolbar">
        <span id="group-count" aria-live="polite">Выбрано: 0</span>
        <button class="group-tool-btn" data-action="nudge" data-dx="-10" data-dy="0" title="Сдвинуть влево" aria-label="Сдвинуть выделенные влево">←</button>
        <button class="group-tool-btn" data-action="nudge" data-dx="0" data-dy="-10" title="Сдвинуть вверх" aria-label="Сдвинуть выделенные вверх">↑</button>
        <button class="group-tool-btn" data-action="nudge" data-dx="0" data-dy="10" title="Сдвинуть вниз" aria-label="Сдвинуть выделенные вниз">↓</button>
        <button class="group-tool-btn" data-action="nudge" data-dx="10" data-dy="0" title="Сдвинуть вправо" aria-label="Сдвинуть выделенные вправо">→</button>
        <button class="group-tool-btn danger" data-action="delete-selected" title="Удалить выделенные" aria-label="Удалить выделенные элементы">🗑 Удалить</button>
    </div>

    <div id="surface" role="region" aria-label="Рабочая область доски"></div>
    
    <div id="hud">
        <button id="select-mode-btn" class="mode-toggle-btn" data-action="toggle-select-mode" title="Режим выделения рамкой (или зажмите Shift)">⬚ Выделение</button>
        <span style="color:#ccc;">|</span>
        <button id="undo-btn" type="button" class="zoom-btn" data-action="undo" title="Отменить (Ctrl+Z)" aria-label="Отменить действие" disabled>↶</button>
        <button id="redo-btn" type="button" class="zoom-btn" data-action="redo" title="Повторить (Ctrl+Shift+Z)" aria-label="Повторить действие" disabled>↷</button>
        <span style="color:#ccc; margin: 0 2px;">|</span>
        <button class="zoom-btn" data-action="zoom" data-zoom="-0.1" aria-label="Уменьшить масштаб">−</button>
        <span id="zoom-val" style="width: 40px; text-align: center;">100%</span>
        <button class="zoom-btn" data-action="zoom" data-zoom="0.1" aria-label="Увеличить масштаб">+</button>
        <span style="color:#ccc; margin: 0 2px;">|</span>
        <span style="font-size: 12px; color: #888; display: none;" id="hud-hint">Фон — двигать, Shift+мышь — выделить</span>
    </div>
</div>

<script src="../../assets/math_board.js"></script>
</body>
</html>
