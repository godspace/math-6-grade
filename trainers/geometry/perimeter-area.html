<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" href="/math-6-grade/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="16x16" href="/math-6-grade/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/math-6-grade/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/math-6-grade/favicon-48x48.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/math-6-grade/apple-touch-icon.png">
    <link rel="manifest" href="/math-6-grade/site.webmanifest">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Геометрия: Профессиональный уровень</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #f8fafc;
            --text: #1e293b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .main-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 30px;
            width: 100%;
            max-width: 650px;
            text-align: center;
        }

        /* Header */
        .level-badge {
            background: #e2e8f0; color: #475569;
            padding: 5px 12px; border-radius: 20px;
            font-size: 0.9em; font-weight: bold;
        }
        .progress-bar {
            height: 6px; background: #e2e8f0; border-radius: 3px;
            margin: 15px 0 20px 0; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: var(--primary); width: 0%; transition: 0.3s;
        }

        /* Task Area */
        .task-box {
            background: #eff6ff;
            border-left: 5px solid var(--primary);
            padding: 20px;
            border-radius: 8px;
            text-align: left;
            margin-bottom: 25px;
        }
        .task-title { font-weight: bold; font-size: 1.1em; color: var(--primary); margin-bottom: 5px; }
        .task-desc { font-size: 1.1em; line-height: 1.5; }

        /* Canvas */
        .canvas-wrapper {
            display: flex; justify-content: center; margin-bottom: 15px;
        }
        .canvas-container {
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 2px solid #334155;
            border-radius: 2px;
            font-size: 0;
        }
        canvas {
            background-color: #fff;
            /* Grid 30px */
            background-image: 
                linear-gradient(#cbd5e1 1px, transparent 1px),
                linear-gradient(90deg, #cbd5e1 1px, transparent 1px);
            background-size: 30px 30px;
            cursor: crosshair;
            touch-action: none;
        }

        /* Minimal Stats (Ruler Only) */
        .ruler-stats {
            display: flex; justify-content: center; gap: 20px;
            margin-bottom: 20px; color: #64748b; font-family: monospace; font-size: 1.2em;
        }
        .ruler-val { color: #0f172a; font-weight: bold; }

        /* Controls */
        .feedback { min-height: 24px; font-weight: bold; margin-bottom: 15px; font-size: 1.1em; }
        .btn {
            background: var(--primary); color: white; border: none; padding: 12px 30px;
            border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn:hover { background: #1d4ed8; transform: translateY(-1px); }
        .btn:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }
        .btn-reset { background: #64748b; margin-left: 10px; }
        .btn-reset:hover { background: #475569; }

        /* Floating Label */
        .cursor-label {
            position: absolute; pointer-events: none;
            background: rgba(15, 23, 42, 0.9); color: white;
            padding: 4px 8px; border-radius: 4px; font-size: 12px;
            display: none; z-index: 100;
        }
    </style>
<script src="../../assets/analytics.js"></script>
</head>
<body>

    <div class="main-card">
        <div>
            <span class="level-badge">Уровень <span id="lvlNum">1</span> / 20</span>
            <div class="progress-bar"><div class="progress-fill" id="pFill"></div></div>
        </div>

        <div class="task-box">
            <div class="task-title" id="tTitle">Задание</div>
            <div class="task-desc" id="tDesc">...</div>
        </div>

        <div class="canvas-wrapper">
            <div class="canvas-container">
                <canvas id="geoCanvas" width="300" height="300"></canvas>
                <div id="cursorLabel" class="cursor-label">0x0</div>
            </div>
        </div>

        <div class="ruler-stats">
            <span>Ширина: <span id="sW" class="ruler-val">0</span></span>
            <span>Высота: <span id="sH" class="ruler-val">0</span></span>
        </div>

        <div class="feedback" id="feedback"></div>

        <div>
            <button class="btn" id="btnCheck" onclick="checkAnswer()">Проверить</button>
            <button class="btn btn-reset" onclick="resetDraw()">Сброс</button>
        </div>
    </div>

<script>
    /*
     LOGIC:
     - 300x300 canvas (10x10 cells).
     - "Base" rectangle is drawn in BLUE outline.
     - User draws in FILLED BLUE.
    */
    
    const levels = [
        // --- БЛОК 1: ПЛОЩАДЬ И ПЕРИМЕТР (Без подсказок) ---
        {
            t: "Основы построения",
            d: "Построй прямоугольник <b>4x6</b>. (Проверяем умение пользоваться сеткой).",
            check: (w,h,s,p) => (w===4 && h===6) || (w===6 && h===4)
        },
        {
            t: "Вычисление периметра",
            d: "Построй <b>квадрат</b>, периметр которого равен <b>16</b> клеткам.",
            // P=16 -> Side=4.
            check: (w,h,s,p) => w===4 && h===4
        },
        {
            t: "Вычисление площади",
            d: "Построй прямоугольник площадью <b>24</b> клетки.",
            // Options: 3x8, 4x6, 2x12 (doesn't fit), etc.
            check: (w,h,s,p) => s===24
        },
        {
            t: "Обратная задача",
            d: "Периметр прямоугольника <b>20</b>, одна сторона <b>3</b>. Построй его.",
            // P=20 -> a+b=10. a=3 -> b=7. Build 3x7.
            check: (w,h,s,p) => (w===3 && h===7) || (w===7 && h===3)
        },
        {
            t: "Квадрат по площади",
            d: "Построй квадрат, площадь которого <b>49</b> клеток.",
            check: (w,h,s,p) => w===7 && h===7
        },

        // --- БЛОК 2: ПРОЦЕНТЫ (РАЗНЫЕ БАЗЫ) ---
        // base: {w, h} - defines the "Whole" (Blue Outline)
        {
            t: "База 5x4 (20 клеток)",
            base: {w:5, h:4},
            d: "Синий контур — это поле (100%). Закрась <b>50%</b> этого поля.",
            // Total=20. Target=10.
            check: (w,h,s,p) => s===10
        },
        {
            t: "База 10x2 (20 клеток)",
            base: {w:10, h:2},
            d: "Поле — узкая полоска (синий контур). Закрась <b>25%</b> этого поля.",
            // Total=20. Target=5.
            check: (w,h,s,p) => s===5
        },
        {
            t: "База 5x10 (50 клеток)",
            base: {w:5, h:10},
            d: "Поле — 50 клеток. Закрась <b>10%</b> этого поля.",
            // Target=5.
            check: (w,h,s,p) => s===5
        },
        {
            t: "База 6x5 (30 клеток)",
            base: {w:6, h:5},
            d: "Поле 30 клеток. Закрась <b>20%</b> поля в виде прямоугольника <b>2x3</b>.",
            // Target=6. But specifically 2x3 dimensions asked? Text says "in shape of 2x3".
            // Let's allow any shape of area 6, but hints usually imply specific shape. Let's strict check.
            check: (w,h,s,p) => s===6 && ((w===2 && h===3)||(w===3 && h===2))
        },
        {
            t: "База 8x5 (40 клеток)",
            base: {w:8, h:5},
            d: "Закрась <b>75%</b> этого поля.",
            // 40 * 0.75 = 30.
            check: (w,h,s,p) => s===30
        },

        // --- БЛОК 3: ВЫЧИСЛЕНИЯ СТОРОН И ПРОЦЕНТОВ ---
        {
            t: "Процент от длины",
            d: "Длина прямоугольника <b>10</b>. Ширина составляет <b>40%</b> от длины. Построй его.",
            // w=10, h=4.
            check: (w,h,s,p) => (w===10 && h===4) || (w===4 && h===10)
        },
        {
            t: "Сравнение сторон",
            d: "Ширина <b>6</b>. Высота составляет <b>50%</b> от ширины. Построй эту фигуру.",
            // 6 and 3.
            check: (w,h,s,p) => (w===6 && h===3) || (w===3 && h===6)
        },
        {
            t: "Увеличение",
            d: "Сторона квадрата была <b>4</b>. Новую сторону увеличили на <b>50%</b>. Построй новый квадрат.",
            // Old=4. 50%=2. New=6. Build 6x6.
            check: (w,h,s,p) => w===6 && h===6
        },
        {
            t: "Доли площади",
            base: {w:10, h:10}, // Full field context
            d: "Построй прямоугольник, площадь которого равна <b>12%</b> от поля 10x10.",
            // S=12.
            check: (w,h,s,p) => s===12
        },

        // --- БЛОК 4: ЭКСПЕРТ ---
        {
            t: "Сложный процент",
            base: {w:5, h:8}, // 40 cells
            d: "Поле (синий контур) — 40 клеток. Построй фигуру, равную <b>60%</b> поля.",
            // 40*0.6 = 24.
            check: (w,h,s,p) => s===24
        },
        {
            t: "Половина от половины",
            base: {w:8, h:8}, // 64
            d: "Поле 8x8. Закрась <b>50%</b> от его <b>половины</b>.",
            // 50% of 50% = 25%. 64 * 0.25 = 16.
            check: (w,h,s,p) => s===16
        },
        {
            t: "Периметр и Площадь",
            d: "Построй прямоугольник с периметром <b>18</b> и площадью <b>20</b>.",
            // Factors of 20: 4x5 -> P=(4+5)*2=18. Match.
            // 2x10 -> P=24.
            check: (w,h,s,p) => s===20 && p===18
        },
        {
            t: "Процент и Периметр",
            base: {w:10, h:5}, // 50 cells
            d: "Площадь фигуры составляет <b>36%</b> от базы (50 кл). Найди её стороны, если одна больше другой в 2 раза.",
            // Target S = 50 * 0.36 = 18.
            // Sides a, b. a*b=18. a=2b. 2b*b=18 -> b^2=9 -> b=3. a=6.
            check: (w,h,s,p) => s===18 && ((w===3 && h===6)||(w===6 && h===3))
        },
        {
            t: "Финальный босс",
            base: {w:10, h:8}, // Визуальная база 80 клеток
            d: "База (синий контур) — <b>80</b> клеток. Вычисли <b>45%</b> от базы. Полученное число — это площадь <b>КВАДРАТА</b>. Построй его.",
            // Решение: 80 * 0.45 = 36. Квадрат площади 36 имеет сторону 6.
            check: (w,h,s,p) => s===36 && w===h
        },
        {
            t: "Бонус: Гранд-мастер",
            base: {w:10, h:8}, // База 80 клеток
            d: "База (синий контур) — <b>80</b> клеток. Найди <b>60%</b> от базы.<br>Построй прямоугольник такой площади, у которого одна сторона составляет <b>75%</b> от другой.",
            // 1. S = 80 * 0.6 = 48.
            // 2. Стороны a и b. a = 0.75b.
            // 3. 0.75b * b = 48 -> b^2 = 64 -> b=8, a=6.
            check: (w,h,s,p) => s===48 && ((w===6 && h===8)||(w===8 && h===6))
        }
    ];

    // Engine
    const canvas = document.getElementById('geoCanvas');
    const ctx = canvas.getContext('2d');
    const CELL = 30;
    
    let curLvlIdx = 0;
    let isDraw = false;
    let start = {x:0, y:0};
    let sel = {x:0, y:0, w:0, h:0};

    // UI
    const uiLvl = document.getElementById('lvlNum');
    const uiFill = document.getElementById('pFill');
    const uiT = document.getElementById('tTitle');
    const uiD = document.getElementById('tDesc');
    const uiW = document.getElementById('sW');
    const uiH = document.getElementById('sH');
    const uiFb = document.getElementById('feedback');
    const uiLbl = document.getElementById('cursorLabel');
    const btnCheck = document.getElementById('btnCheck');

    function loadLevel() {
        if(curLvlIdx >= levels.length) {
            document.querySelector('.main-card').innerHTML = `
                <h2 style='color:var(--success)'>Курс пройден! 🎓</h2>
                <p>Ты отлично справляешься с геометрией и процентами.</p>
                <button class='btn' onclick='location.reload()'>Начать заново</button>`;
            return;
        }
        const lvl = levels[curLvlIdx];
        uiLvl.textContent = curLvlIdx + 1;
        uiFill.style.width = ((curLvlIdx)/levels.length*100) + "%";
        uiT.textContent = lvl.t;
        uiD.innerHTML = lvl.d;
        uiFb.textContent = "";
        btnCheck.disabled = false;
        resetDraw();
    }

    // Input Handling
    function getCell(e) {
        const r = canvas.getBoundingClientRect();
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: Math.floor((cx - r.left)/CELL),
            y: Math.floor((cy - r.top)/CELL)
        };
    }
    
    canvas.addEventListener('mousedown', startD);
    canvas.addEventListener('touchstart', e=>{e.preventDefault(); startD(e)}, {passive:false});
    window.addEventListener('mousemove', moveD);
    window.addEventListener('touchmove', moveD, {passive:false});
    window.addEventListener('mouseup', endD);
    window.addEventListener('touchend', endD);

    function startD(e) {
        isDraw = true;
        const c = getCell(e);
        start = {x: Math.max(0, Math.min(9, c.x)), y: Math.max(0, Math.min(9, c.y))};
        updSel(start.x, start.y);
    }
    function moveD(e) {
        if(!isDraw) return;
        const c = getCell(e);
        updSel(Math.max(0, Math.min(9, c.x)), Math.max(0, Math.min(9, c.y)), e);
    }
    function endD() { isDraw = false; uiLbl.style.display = 'none'; }

    function updSel(tx, ty, e) {
        const x = Math.min(start.x, tx);
        const y = Math.min(start.y, ty);
        const w = Math.abs(tx - start.x) + 1;
        const h = Math.abs(ty - start.y) + 1;
        sel = {x, y, w, h};
        draw();
        uiW.textContent = w;
        uiH.textContent = h;

        if(e) {
            const r = canvas.getBoundingClientRect();
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            uiLbl.style.display = 'block';
            uiLbl.style.left = (cx - r.left + 15)+'px';
            uiLbl.style.top = (cy - r.top - 20)+'px';
            uiLbl.textContent = `${w}x${h}`;
        }
    }

    function draw() {
        ctx.clearRect(0,0,300,300);
        
        // Draw Base (if any)
        const lvl = levels[curLvlIdx];
        if(lvl.base) {
            ctx.strokeStyle = "#3b82f6"; // Blue Outline
            ctx.lineWidth = 3;
            ctx.setLineDash([5, 5]);
            ctx.strokeRect(0, 0, lvl.base.w * CELL, lvl.base.h * CELL);
            ctx.setLineDash([]);
            
            // Optional: Light highlight
            ctx.fillStyle = "rgba(59, 130, 246, 0.05)";
            ctx.fillRect(0, 0, lvl.base.w * CELL, lvl.base.h * CELL);
        }

        // Draw User Selection
        if(sel.w > 0) {
            ctx.fillStyle = "rgba(37, 99, 235, 0.5)"; // Darker blue
            ctx.fillRect(sel.x*CELL, sel.y*CELL, sel.w*CELL, sel.h*CELL);
            ctx.strokeStyle = "#1e3a8a";
            ctx.lineWidth = 2;
            ctx.strokeRect(sel.x*CELL, sel.y*CELL, sel.w*CELL, sel.h*CELL);
        }
    }

    function resetDraw() {
        sel = {x:0, y:0, w:0, h:0};
        uiW.textContent = 0; uiH.textContent = 0;
        draw();
        uiFb.textContent = "";
        btnCheck.disabled = false;
    }

    function checkAnswer() {
        if(sel.w === 0) { uiFb.innerHTML = "<span style='color:var(--danger)'>Нарисуй что-нибудь!</span>"; return; }
        
        const lvl = levels[curLvlIdx];
        const s = sel.w * sel.h;
        const p = (sel.w + sel.h) * 2;
        
        if(lvl.check(sel.w, sel.h, s, p)) {
            uiFb.innerHTML = "<span style='color:var(--success)'>Верно! Молодец.</span>";
            btnCheck.disabled = true;
            setTimeout(() => {
                curLvlIdx++;
                loadLevel();
            }, 1000);
        } else {
            uiFb.innerHTML = "<span style='color:var(--danger)'>Ошибка. Проверь вычисления.</span>";
        }
    }

    loadLevel();

</script>
</body>

</html>
